function = "vendor.tabpack.tabpack.main"
n_seeds = 15

[base_config]
n_models = 3
batch_size = 1024
n_epochs = -1
patience = 16
amp_dtype = "bfloat16"
save_all_predictions = true
track_online_ensemble_history = true
track_experiments = true

[base_config.data]
path = "data/beyond-electric_motor_temperature_prediction-0"
num_policy = "noisy-quantile"
cache = true
extract_bin_from_num = true
bin_policy = "convert-to-cat"

[base_config.model]
activation = "ReLU"
d_block = 384

[base_config.model.num_embeddings]
type = "CosineEmbeddingsPack"

[base_config.optimizer]
type = "MuonAdamWPack"
shared_step = true

[base_config.online_ensembles.greedy]
type = "greedy"
update_type = "latest"
include_current_ensemble_in_pool = true
patience = 32

[base_config.online_ensembles.greedy.options]
max_ensemble_size = 32

[base_config.loss]
type = "adaqr"
n_quantiles = 384
y_true_mode = "identity"
raw_sigma_scale = 1.0
min_sigma = 1e-05
muls_init_add = 0.5
regularizer = 0.7071
scale_reg_balance = "equal_loss"

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 1
dropout = 0.0

[base_config.configs.model.num_embeddings]
d_embedding = 24
init_scale = 0.025974599147866057

[base_config.configs.optimizer]
lr = 0.0002157682483410602
weight_decay = 0.01276954761904551
muon_lr = 0.043851702560851274

[base_config.configs.loss]
scale_reg_weight = 1.4461835703563004

