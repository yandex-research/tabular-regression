function = "vendor.tabpack.tabpack.main"
n_seeds = 15

[base_config]
n_models = 3
batch_size = 512
n_epochs = -1
patience = 16
amp_dtype = "bfloat16"
save_all_predictions = true
track_online_ensemble_history = true
track_experiments = true

[base_config.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true
extract_bin_from_num = true
bin_policy = "convert-to-cat"

[base_config.model]
activation = "ReLU"
d_block = 384

[base_config.model.num_embeddings]
type = "CosineEmbeddingsPack"

[base_config.optimizer]
type = "MuonAdamWPack"
shared_step = true

[base_config.online_ensembles.greedy]
type = "greedy"
update_type = "latest"
include_current_ensemble_in_pool = true
patience = 32

[base_config.online_ensembles.greedy.options]
max_ensemble_size = 32

[base_config.loss]
type = "quantile"
n_quantiles = 384
agg_mode = "sum"

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 3
dropout = 0.0

[base_config.configs.model.num_embeddings]
d_embedding = 20
init_scale = 0.01913469447807098

[base_config.configs.optimizer]
lr = 0.0009517345163307438
weight_decay = 0.6136045802294308
muon_lr = 0.004336485563242767

