function = "vendor.tabpack.tabpack.main"
n_seeds = 15

[base_config]
n_models = 2
batch_size = 256
n_epochs = -1
patience = 16
amp_dtype = "bfloat16"
save_all_predictions = true
track_online_ensemble_history = true
track_experiments = true

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true
extract_bin_from_num = true
bin_policy = "convert-to-cat"

[base_config.model]
activation = "ReLU"
d_block = 384

[base_config.model.num_embeddings]
type = "CosineEmbeddingsPack"

[base_config.optimizer]
type = "MuonAdamWPack"
shared_step = true

[base_config.online_ensembles.greedy]
type = "greedy"
update_type = "latest"
include_current_ensemble_in_pool = true
patience = 32

[base_config.online_ensembles.greedy.options]
max_ensemble_size = 32

[base_config.loss]
type = "quantile"
n_quantiles = 384
agg_mode = "sum"

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 3
dropout = 0.0

[base_config.configs.model.num_embeddings]
d_embedding = 12
init_scale = 0.7318721218160568

[base_config.configs.optimizer]
lr = 0.0009565200055196776
weight_decay = 0.005172237564581169
muon_lr = 0.07386317908787135

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 3
dropout = 0.0

[base_config.configs.model.num_embeddings]
d_embedding = 20
init_scale = 0.5667978665379022

[base_config.configs.optimizer]
lr = 0.004308251552958122
weight_decay = 0.007523892475314572
muon_lr = 0.0030314999110705094
