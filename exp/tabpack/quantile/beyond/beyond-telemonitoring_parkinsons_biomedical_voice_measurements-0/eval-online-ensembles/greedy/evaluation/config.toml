function = "vendor.tabpack.tabpack.main"
n_seeds = 15

[base_config]
n_models = 3
batch_size = 32
n_epochs = -1
patience = 16
amp_dtype = "bfloat16"
save_all_predictions = true
track_online_ensemble_history = true
track_experiments = true

[base_config.data]
path = "data/beyond-telemonitoring_parkinsons_biomedical_voice_measurements-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true
extract_bin_from_num = true

[base_config.model]
activation = "ReLU"
d_block = 384

[base_config.model.num_embeddings]
type = "CosineEmbeddingsPack"

[base_config.optimizer]
type = "MuonAdamWPack"
shared_step = true

[base_config.online_ensembles.greedy]
type = "greedy"
update_type = "latest"
include_current_ensemble_in_pool = true
patience = 32

[base_config.online_ensembles.greedy.options]
max_ensemble_size = 32

[base_config.loss]
type = "quantile"
n_quantiles = 384
agg_mode = "sum"

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 1
dropout = 0.0

[base_config.configs.model.num_embeddings]
d_embedding = 16
init_scale = 0.06218230782016853

[base_config.configs.optimizer]
lr = 0.002067282435468936
weight_decay = 0.023358825194833552
muon_lr = 0.013704648392849027

