function = "vendor.tabpack.tabpack.main"
n_seeds = 15

[base_config]
n_models = 3
batch_size = 256
n_epochs = -1
patience = 16
amp_dtype = "bfloat16"
save_all_predictions = true
track_online_ensemble_history = true
track_experiments = true

[base_config.data]
path = "data/beyond-food_delivery_time-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true
extract_bin_from_num = true
bin_policy = "convert-to-cat"

[base_config.model]
activation = "ReLU"
d_block = 384

[base_config.model.num_embeddings]
type = "CosineEmbeddingsPack"

[base_config.optimizer]
type = "MuonAdamWPack"
shared_step = true

[base_config.online_ensembles.greedy]
type = "greedy"
update_type = "latest"
include_current_ensemble_in_pool = true
patience = 32

[base_config.online_ensembles.greedy.options]
max_ensemble_size = 32

[base_config.loss]
type = "hl_gauss"
hl_num_bins = 384
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
sigma = 0.5

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 1
dropout = 0.0

[base_config.configs.model.num_embeddings]
d_embedding = 28
init_scale = 2.642146388997605

[base_config.configs.optimizer]
lr = 0.0009265846138161248
weight_decay = 0.016655201514737622
muon_lr = 0.0013750990781024857

[base_config.configs.loss]
sigma = 0.7626746982138285

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 1
dropout = 0.0

[base_config.configs.model.num_embeddings]
d_embedding = 20
init_scale = 1.1216155111322075

[base_config.configs.optimizer]
lr = 0.0015200111243859492
weight_decay = 0.007088535843752506
muon_lr = 0.005752464031093663

[base_config.configs.loss]
sigma = 0.030826272414161353

