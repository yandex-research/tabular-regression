function = "vendor.tabpack.tabpack.main"
n_seeds = 15

[base_config]
n_models = 2
batch_size = 32
n_epochs = -1
patience = 16
amp_dtype = "bfloat16"
save_all_predictions = true
track_online_ensemble_history = true
track_experiments = true

[base_config.data]
path = "data/beyond-mutual_funds_india-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true
extract_bin_from_num = true
bin_policy = "convert-to-cat"

[base_config.model]
activation = "ReLU"
d_block = 384

[base_config.model.num_embeddings]
type = "CosineEmbeddingsPack"

[base_config.optimizer]
type = "MuonAdamWPack"
shared_step = true

[base_config.online_ensembles.greedy]
type = "greedy"
update_type = "latest"
include_current_ensemble_in_pool = true
patience = 32

[base_config.online_ensembles.greedy.options]
max_ensemble_size = 32

[base_config.loss]
type = "hl_gauss"
hl_num_bins = 384
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
sigma = 0.5

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 3
dropout = 0.11215851448736963

[base_config.configs.model.num_embeddings]
d_embedding = 8
init_scale = 3.8598866585479676

[base_config.configs.optimizer]
lr = 0.004497394956048386
weight_decay = 0.7629638729420635
muon_lr = 0.06502958739089243

[base_config.configs.loss]
sigma = 1.227808209530072

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 2
dropout = 0.31111552941989745

[base_config.configs.model.num_embeddings]
d_embedding = 12
init_scale = 0.04258433297085861

[base_config.configs.optimizer]
lr = 0.00015724481099059487
weight_decay = 0.05387914955414468
muon_lr = 0.024577630559592535

[base_config.configs.loss]
sigma = 0.651016755995342
