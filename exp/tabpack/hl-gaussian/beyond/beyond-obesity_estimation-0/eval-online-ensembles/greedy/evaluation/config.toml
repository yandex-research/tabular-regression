function = "vendor.tabpack.tabpack.main"
n_seeds = 15

[base_config]
n_models = 3
batch_size = 32
n_epochs = -1
patience = 16
amp_dtype = "bfloat16"
save_all_predictions = true
track_online_ensemble_history = true
track_experiments = true

[base_config.data]
path = "data/beyond-obesity_estimation-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true
extract_bin_from_num = true

[base_config.model]
activation = "ReLU"
d_block = 384

[base_config.model.num_embeddings]
type = "CosineEmbeddingsPack"

[base_config.optimizer]
type = "MuonAdamWPack"
shared_step = true

[base_config.online_ensembles.greedy]
type = "greedy"
update_type = "latest"
include_current_ensemble_in_pool = true
patience = 32

[base_config.online_ensembles.greedy.options]
max_ensemble_size = 32

[base_config.loss]
type = "hl_gauss"
hl_num_bins = 384
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
sigma = 0.5

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 3
dropout = 0.048049203946981534

[base_config.configs.model.num_embeddings]
d_embedding = 32
init_scale = 0.2546558192892437

[base_config.configs.optimizer]
lr = 0.004565494145842647
weight_decay = 0.06524339610666338
muon_lr = 0.030097273776147328

[base_config.configs.loss]
sigma = 0.012757532278315204

[[base_config.configs]]

[base_config.configs.model]
n_blocks = 3
dropout = 0.0

[base_config.configs.model.num_embeddings]
d_embedding = 32
init_scale = 0.07756553550975767

[base_config.configs.optimizer]
lr = 0.0048461555130215155
weight_decay = 0.00560092971945111
muon_lr = 0.001628592047444122

[base_config.configs.loss]
sigma = 3.686316097801864

