function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-miami_housing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.31491431018425425
depth = 5
l2_leaf_reg = 5.744011086116982
leaf_estimation_iterations = 3
learning_rate = 0.015432513779971084
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
