function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.22293587178717789
depth = 4
l2_leaf_reg = 4.438332223909421
leaf_estimation_iterations = 1
learning_rate = 0.1195688612365007
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
