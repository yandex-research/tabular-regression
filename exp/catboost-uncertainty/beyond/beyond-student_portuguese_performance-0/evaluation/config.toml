function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-student_portuguese_performance-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.9773435888813603
depth = 3
l2_leaf_reg = 0.2896939304880015
leaf_estimation_iterations = 6
learning_rate = 0.41987969895327126
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
