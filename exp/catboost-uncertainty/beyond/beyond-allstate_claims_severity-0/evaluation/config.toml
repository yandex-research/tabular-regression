function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-allstate_claims_severity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.12828231141474364
depth = 7
l2_leaf_reg = 9.811833617170846
leaf_estimation_iterations = 1
learning_rate = 0.010432634491125666
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
