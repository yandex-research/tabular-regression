function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-obesity_estimation-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.9352898348113118
depth = 4
l2_leaf_reg = 5.85826587540615
leaf_estimation_iterations = 3
learning_rate = 0.2138172734275991
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
