function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-cirrhosis_patient_survival_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.7530863434087253
depth = 4
l2_leaf_reg = 2.190324690772734
leaf_estimation_iterations = 2
learning_rate = 0.3111587831185422
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
