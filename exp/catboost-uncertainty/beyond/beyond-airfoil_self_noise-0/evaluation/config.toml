function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-airfoil_self_noise-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.48369446478839506
depth = 6
l2_leaf_reg = 5.8123001329233706
leaf_estimation_iterations = 1
learning_rate = 0.058749583789875943
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
