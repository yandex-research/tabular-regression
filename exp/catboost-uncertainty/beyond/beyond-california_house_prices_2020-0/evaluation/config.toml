function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.04682909099083015
depth = 4
l2_leaf_reg = 8.200989366763338
leaf_estimation_iterations = 3
learning_rate = 0.0024709903299975264
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
