function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-mercedes_benz_greener_manufacturing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.04059524157909014
depth = 5
l2_leaf_reg = 5.564667002209251
leaf_estimation_iterations = 2
learning_rate = 0.0024111589557381384
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
