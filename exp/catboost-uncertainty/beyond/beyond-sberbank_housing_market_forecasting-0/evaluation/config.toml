function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-sberbank_housing_market_forecasting-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.0868562142961025
depth = 10
l2_leaf_reg = 8.749259900623873
leaf_estimation_iterations = 6
learning_rate = 0.0037017755898222514
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
