function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-wine_quality-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.953165419298076
depth = 6
l2_leaf_reg = 9.564156703189079
leaf_estimation_iterations = 3
learning_rate = 0.058589010492389675
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
