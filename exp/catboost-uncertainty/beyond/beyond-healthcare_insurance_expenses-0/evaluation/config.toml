function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-healthcare_insurance_expenses-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.08712929970154071
depth = 3
l2_leaf_reg = 8.342936470924586
leaf_estimation_iterations = 8
learning_rate = 0.407414465416623
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
