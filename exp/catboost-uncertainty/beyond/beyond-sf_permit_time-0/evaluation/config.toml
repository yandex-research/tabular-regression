function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-sf_permit_time-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.48237203501103576
depth = 5
l2_leaf_reg = 9.985757096701349
leaf_estimation_iterations = 2
learning_rate = 0.018314561130341692
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
