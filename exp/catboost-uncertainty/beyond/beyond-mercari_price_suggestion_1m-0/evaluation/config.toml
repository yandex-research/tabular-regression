function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-mercari_price_suggestion_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.38110492982291705
depth = 8
l2_leaf_reg = 9.237467012229292
leaf_estimation_iterations = 2
learning_rate = 0.04612627585391866
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
