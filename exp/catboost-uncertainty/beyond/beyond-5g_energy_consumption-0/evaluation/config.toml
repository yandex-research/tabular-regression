function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-5g_energy_consumption-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.8610886655488503
depth = 12
l2_leaf_reg = 8.495801905349714
leaf_estimation_iterations = 10
learning_rate = 0.048452114529377505
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
