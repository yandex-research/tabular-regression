function = "bin.catboost_uncertainty.main"
n_seeds = 15

[base_config.data]
path = "data/beyond-telemonitoring_parkinsons_biomedical_voice_measurements-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.model]
iterations = 4000
early_stopping_rounds = 200
od_pval = 0.001
bagging_temperature = 0.7123760811935753
depth = 12
l2_leaf_reg = 8.915806320506857
leaf_estimation_iterations = 1
learning_rate = 0.11227007392102983
task_type = "GPU"
thread_count = 4

[base_config.fit]
logging_level = "Verbose"
