function = "bin.adaqr.main"
n_seeds = 15
n_workers = 2
[base_config]
n_cohorts = 10
cohort_rng_seed = 10001
density_k = 20
compute_density_signals = false
cohort_strategy = "uncertainty"
cohort_cache_dir = "cache/cohorts/beyond-electric_motor_temperature_prediction-0"
cohort_uncertainty_path = "data/cohort-uncertainty/beyond-electric_motor_temperature_prediction-0.npz"
cohort_uncertainty_kind = "catboost_data_uncertainty"
source_evaluation_config = "exp/mlp/muon/adaqr/beyond/beyond-electric_motor_temperature_prediction-0/evaluation/config.toml"
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 992
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.47831393450523435
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-electric_motor_temperature_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0002553146275534163
weight_decay = 0.5224218809863926
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0006207003156588838

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 64
dropout = 0.0
