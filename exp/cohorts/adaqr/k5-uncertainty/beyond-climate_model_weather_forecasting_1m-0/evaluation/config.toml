function = "bin.adaqr.main"
n_seeds = 15
n_workers = 2
[base_config]
n_cohorts = 5
cohort_rng_seed = 10001
density_k = 20
compute_density_signals = false
cohort_strategy = "uncertainty"
cohort_cache_dir = "cache/cohorts/beyond-climate_model_weather_forecasting_1m-0"
cohort_uncertainty_path = "data/cohort-uncertainty/beyond-climate_model_weather_forecasting_1m-0.npz"
cohort_uncertainty_kind = "catboost_data_uncertainty"
source_evaluation_config = "exp/mlp/muon/adaqr/beyond/beyond-climate_model_weather_forecasting_1m-0/evaluation/config.toml"
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 480
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.9059797501433847
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-climate_model_weather_forecasting_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 7.65030683975807e-05
weight_decay = 0.2367754676124474
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00015188916198191155

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 464
dropout = 0.3460512222846687
