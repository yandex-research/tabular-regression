function = "bin.quantile_regression_cohort_early_stopping.main"
n_seeds = 15
n_workers = 2
[base_config]
n_cohorts = 10
cohort_rng_seed = 10001
density_k = 20
compute_density_signals = false
cohort_uncertainty_path = "data/cohort-uncertainty/beyond-climate_model_weather_forecasting_1m-0.npz"
cohort_uncertainty_kind = "catboost_data_uncertainty"
source_evaluation_config = "exp/mlp/muon/quantile/beyond/beyond-climate_model_weather_forecasting_1m-0/evaluation/config.toml"
cohort_strategy = "random_stitched"
cohort_cache_dir = "cache/cohorts/beyond-climate_model_weather_forecasting_1m-0"
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 96
agg_mode = "sum"

[base_config.data]
path = "data/beyond-climate_model_weather_forecasting_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 5.231045132179134e-05
weight_decay = 0.22703804969881483
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00012978286816704192

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 272
dropout = 0.3059586077259359
