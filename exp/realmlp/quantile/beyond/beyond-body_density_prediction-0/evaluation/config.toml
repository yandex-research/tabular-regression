function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-body_density_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 384
p_drop = 0.32130974187549993
plr_sigma = 0.016328781368724156
sq_mom = 0.9660685733618976
plr_lr_factor = 0.13935194936681683
scale_lr_factor = 2.674431994010393
first_layer_lr_factor = 0.32904658602807035
lr = 0.047795546348204564
wd = 0.002010458774949375
muon_lr = 0.26856924802472676
muon_mom = 0.95
max_one_hot_cat_size = 14
embedding_size = 4
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "quantile"
loss_n_quantiles = 64
