function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-qsar_aquatic_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.1141820420554168
plr_sigma = 0.012629082648178877
sq_mom = 0.9888787199121153
plr_lr_factor = 0.06252315494525763
scale_lr_factor = 3.473423387768205
first_layer_lr_factor = 0.6399248199544372
lr = 0.09540091093968249
wd = 0.0023876276180653305
muon_lr = 0.03544484422230767
muon_mom = 0.95
max_one_hot_cat_size = 8
embedding_size = 4
plr_hidden_1 = 32
plr_hidden_2 = 64
n_epochs = 512
use_early_stopping = true
train_metric_name = "quantile"
loss_n_quantiles = 832
