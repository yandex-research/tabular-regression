function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-cirrhosis_patient_survival_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.14045840120544267
plr_sigma = 0.04162492285214177
sq_mom = 0.9861118118192614
plr_lr_factor = 0.1638522383114999
scale_lr_factor = 2.4586513665158476
first_layer_lr_factor = 0.5081821141907878
lr = 0.06425343986249965
wd = 0.0010082722150860349
muon_lr = 0.02717117693496594
muon_mom = 0.95
max_one_hot_cat_size = 8
embedding_size = 4
plr_hidden_1 = 8
plr_hidden_2 = 64
n_epochs = 256
use_early_stopping = true
train_metric_name = "quantile"
loss_n_quantiles = 896
