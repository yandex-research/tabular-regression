function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-forest_fires-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 4
hidden_width = 512
p_drop = 0.2890891085080235
plr_sigma = 49.360096976205654
sq_mom = 0.9732365624924737
plr_lr_factor = 0.29793782327994933
scale_lr_factor = 5.637815451235096
first_layer_lr_factor = 0.41868250291121406
lr = 0.29890496079814277
wd = 0.003104724277013361
muon_lr = 0.03011471768272443
muon_mom = 0.95
max_one_hot_cat_size = 4
embedding_size = 8
plr_hidden_1 = 64
plr_hidden_2 = 8
n_epochs = 512
use_early_stopping = true
train_metric_name = "quantile"
loss_n_quantiles = 384
