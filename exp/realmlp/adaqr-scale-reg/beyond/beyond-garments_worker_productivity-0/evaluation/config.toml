function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-garments_worker_productivity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.29057346416919827
plr_sigma = 0.5814201811288676
sq_mom = 0.9542993228005339
plr_lr_factor = 0.05522099997428498
scale_lr_factor = 7.309076797865256
first_layer_lr_factor = 1.2654727625770434
lr = 0.2554985730125425
wd = 0.016823821740389242
muon_lr = 0.1367889806033776
muon_mom = 0.95
max_one_hot_cat_size = 6
embedding_size = 16
plr_hidden_1 = 8
plr_hidden_2 = 16
n_epochs = 512
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 32
regularizer = 0.593249837197497
scale_reg_weight = 0.18999388919800053
