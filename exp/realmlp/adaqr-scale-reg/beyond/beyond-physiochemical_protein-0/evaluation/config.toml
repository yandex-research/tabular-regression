normalize_output = false
n_hidden_layers = 3
hidden_width = 384
p_drop = 0.3050833221729194
plr_sigma = 0.029783013229593605
sq_mom = 0.9934085930294142
plr_lr_factor = 0.1988725218171448
scale_lr_factor = 4.510831956771053
first_layer_lr_factor = 0.47237278984278336
lr = 0.29851596030226424
wd = 0.0012267736139145492
muon_lr = 0.21420564011198012
muon_mom = 0.95
max_one_hot_cat_size = 4
embedding_size = 8
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "adaqr"
loss_n_quantiles = 416
regularizer = 0.1612851477129691
scale_reg_weight = 0.015026768455629806
