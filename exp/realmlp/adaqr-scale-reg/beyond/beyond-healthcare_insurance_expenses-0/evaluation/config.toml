sq_mom = 0.9845257590550255
plr_lr_factor = 0.13285337691207494
scale_lr_factor = 2.664614333230513
first_layer_lr_factor = 0.7812658963485368
lr = 0.22945628166034723
wd = 0.007230845935296212
muon_lr = 0.24636021886127576
muon_mom = 0.95
max_one_hot_cat_size = 24
embedding_size = 4
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "adaqr"
loss_n_quantiles = 736
regularizer = 0.13131056885112036
scale_reg_weight = 0.008872083300368672
