sq_mom = 0.9949975349965089
plr_lr_factor = 0.05198216424660043
scale_lr_factor = 3.150591177266844
first_layer_lr_factor = 0.3858817008787047
lr = 0.20838343370413562
wd = 0.011652232491788468
muon_lr = 0.2462370127398098
muon_mom = 0.95
max_one_hot_cat_size = 18
embedding_size = 8
plr_hidden_1 = 32
plr_hidden_2 = 32
n_epochs = 512
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 960
regularizer = 0.2520974658057943
scale_reg_weight = 1.435079089791833
