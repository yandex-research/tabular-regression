block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.012124893851464431
plr_sigma = 0.03784917695919395
sq_mom = 0.9682292607034538
plr_lr_factor = 0.14351753647869295
scale_lr_factor = 4.756032115026853
first_layer_lr_factor = 0.703216410173462
lr = 0.0586013614712087
wd = 0.0063572499881072
muon_lr = 0.17486653125329849
muon_mom = 0.95
max_one_hot_cat_size = 10
embedding_size = 8
plr_hidden_1 = 16
plr_hidden_2 = 64
n_epochs = 512
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 960
regularizer = 0.21027993224727218
scale_reg_weight = 0.4242147942314064
