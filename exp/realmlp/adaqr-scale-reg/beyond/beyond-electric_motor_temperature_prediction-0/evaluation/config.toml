function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-electric_motor_temperature_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 2
hidden_width = 384
p_drop = 0.158991589696988
plr_sigma = 0.3406798054912675
sq_mom = 0.9942041451484465
plr_lr_factor = 0.17290917946949017
scale_lr_factor = 4.9781435589028815
first_layer_lr_factor = 0.45985461396814026
lr = 0.08249306836320461
wd = 0.0014441161004737433
muon_lr = 0.09514711727715967
muon_mom = 0.95
max_one_hot_cat_size = 28
embedding_size = 8
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "adaqr"
loss_n_quantiles = 192
regularizer = 0.5869264218752731
scale_reg_weight = 0.0011651332955712017
