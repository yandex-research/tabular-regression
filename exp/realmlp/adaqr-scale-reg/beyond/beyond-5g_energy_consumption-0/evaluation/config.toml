function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-5g_energy_consumption-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.000716947532034308
plr_sigma = 24.611965538686732
sq_mom = 0.9945209184434257
plr_lr_factor = 0.26991419779622083
scale_lr_factor = 5.9051939878944815
first_layer_lr_factor = 1.1245660218730633
lr = 0.25261247257137487
wd = 0.0012631952348189954
muon_lr = 0.12352483871547694
muon_mom = 0.95
max_one_hot_cat_size = 7
embedding_size = 16
plr_hidden_1 = 8
plr_hidden_2 = 32
n_epochs = 256
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 224
regularizer = 0.005398392484814968
scale_reg_weight = 0.01938244122285982
