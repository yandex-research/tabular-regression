function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.14808234280884702
plr_sigma = 2.329563058216651
sq_mom = 0.9820694603039227
plr_lr_factor = 0.15497648325777036
scale_lr_factor = 4.122784805762369
first_layer_lr_factor = 0.3816810588264805
lr = 0.29596709436363045
wd = 0.00471297129920784
muon_lr = 0.05867617809283586
muon_mom = 0.95
max_one_hot_cat_size = 32
embedding_size = 16
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "adaqr"
loss_n_quantiles = 960
regularizer = 0.9377234719415729
scale_reg_weight = 0.7562975257246652
