function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-mercedes_benz_greener_manufacturing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 4
hidden_width = 512
p_drop = 0.4863810779377051
plr_sigma = 0.03143689773271299
sq_mom = 0.9716743762122853
plr_lr_factor = 0.06672556027580895
scale_lr_factor = 2.3982879149826584
first_layer_lr_factor = 1.238018538874209
lr = 0.07989348944837348
wd = 0.02707249723132947
muon_lr = 0.08687474745197778
muon_mom = 0.95
max_one_hot_cat_size = 13
embedding_size = 8
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "adaqr"
loss_n_quantiles = 96
regularizer = 0.5400863101378484
scale_reg_weight = 0.2919059496883212
