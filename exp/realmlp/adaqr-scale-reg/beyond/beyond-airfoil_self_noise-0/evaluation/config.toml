function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-airfoil_self_noise-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.06501630307617508
plr_sigma = 0.7011599870012847
sq_mom = 0.9620924072506145
plr_lr_factor = 0.22591682042791825
scale_lr_factor = 4.068067843749249
first_layer_lr_factor = 0.6204976493598389
lr = 0.03038831123116234
wd = 0.008532165664054868
muon_lr = 0.2685632520699251
muon_mom = 0.95
max_one_hot_cat_size = 8
embedding_size = 4
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "adaqr"
loss_n_quantiles = 128
regularizer = 0.08779764852544497
scale_reg_weight = 0.012737052405920617
