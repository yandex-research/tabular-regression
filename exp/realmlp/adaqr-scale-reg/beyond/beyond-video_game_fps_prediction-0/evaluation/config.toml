function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-video_game_fps_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 2
hidden_width = 512
p_drop = 0.1178759075465927
plr_sigma = 11.517967575311417
sq_mom = 0.9933042528027062
plr_lr_factor = 0.05990373900260142
scale_lr_factor = 3.7698286156880103
first_layer_lr_factor = 0.33604234913778147
lr = 0.04717848970850321
wd = 0.04538279978591562
muon_lr = 0.03767752731201231
muon_mom = 0.95
max_one_hot_cat_size = 5
embedding_size = 4
plr_hidden_1 = 16
plr_hidden_2 = 64
n_epochs = 512
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 96
regularizer = 0.30065652203615567
scale_reg_weight = 0.3577232986508774
