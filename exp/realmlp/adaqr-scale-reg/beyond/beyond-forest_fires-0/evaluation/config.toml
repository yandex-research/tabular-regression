function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-forest_fires-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.46448284398551243
plr_sigma = 13.051151263446505
sq_mom = 0.9780249910037002
plr_lr_factor = 0.16327008442531
scale_lr_factor = 8.539707100513786
first_layer_lr_factor = 1.1052637716842375
lr = 0.19076984635902175
wd = 0.001101760621540289
muon_lr = 0.24929816748301684
muon_mom = 0.95
max_one_hot_cat_size = 16
embedding_size = 4
plr_hidden_1 = 8
plr_hidden_2 = 64
n_epochs = 256
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 480
regularizer = 0.05544144772396422
scale_reg_weight = 0.006398603924126584
