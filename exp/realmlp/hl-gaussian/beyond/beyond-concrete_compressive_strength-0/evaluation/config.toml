normalize_output = false
n_hidden_layers = 4
hidden_width = 512
p_drop = 0.41571009926416963
plr_sigma = 1.5576971455049065
sq_mom = 0.9767780290775913
plr_lr_factor = 0.078659312108009
scale_lr_factor = 3.23420313100708
first_layer_lr_factor = 0.33115955573066896
lr = 0.11744680557345628
wd = 0.0011027162433758155
muon_lr = 0.06871106780713777
muon_mom = 0.95
max_one_hot_cat_size = 17
embedding_size = 4
plr_hidden_1 = 16
plr_hidden_2 = 8
n_epochs = 256
use_early_stopping = true
train_metric_name = "hlgauss"
loss_n_bins = 352
loss_sigma = 1.2956819294204338
