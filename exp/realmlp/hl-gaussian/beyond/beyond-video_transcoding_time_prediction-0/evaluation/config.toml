function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 4
hidden_width = 384
p_drop = 0.1471541867089412
plr_sigma = 0.202282104089569
sq_mom = 0.9526181697205507
plr_lr_factor = 0.08872114813142856
scale_lr_factor = 4.811804807527941
first_layer_lr_factor = 1.2837146082374566
lr = 0.055385564706805855
wd = 0.010162972707565129
muon_lr = 0.02643763249436185
muon_mom = 0.95
max_one_hot_cat_size = 19
embedding_size = 16
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "hlgauss"
loss_n_bins = 896
loss_sigma = 0.08535675250804171
