function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-qsar_fish_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.05666928553844064
plr_sigma = 2.48258510418835
sq_mom = 0.9713582997164855
plr_lr_factor = 0.2204621134886618
scale_lr_factor = 8.424404899193991
first_layer_lr_factor = 0.3445292937855754
lr = 0.09823334914896557
wd = 0.0013647274630244949
muon_lr = 0.07064335374236647
muon_mom = 0.95
max_one_hot_cat_size = 13
embedding_size = 8
plr_hidden_1 = 8
plr_hidden_2 = 16
n_epochs = 512
use_early_stopping = true
train_metric_name = "hlgauss"
loss_n_bins = 64
loss_sigma = 0.05885476444434832
