function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-immoscout_german_house_prices-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 384
p_drop = 0.0001247446508620513
plr_sigma = 10.659082122589377
sq_mom = 0.9552372382185208
plr_lr_factor = 0.1149339508142386
scale_lr_factor = 2.768047607220856
first_layer_lr_factor = 0.40895362211950764
lr = 0.059201543659178464
wd = 0.005609458032784704
muon_lr = 0.06444892466877034
muon_mom = 0.95
max_one_hot_cat_size = 20
embedding_size = 8
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "hlgauss"
loss_n_bins = 544
loss_sigma = 1.0262082810914088
