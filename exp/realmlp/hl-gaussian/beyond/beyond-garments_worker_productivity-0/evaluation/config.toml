function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-garments_worker_productivity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.150558624013874
plr_sigma = 0.4205581485766367
sq_mom = 0.9795621395042542
plr_lr_factor = 0.24962200833312156
scale_lr_factor = 3.688742187804838
first_layer_lr_factor = 0.7861044461759903
lr = 0.07622439422140417
wd = 0.0011401184292907322
muon_lr = 0.06365977547337924
muon_mom = 0.95
max_one_hot_cat_size = 17
embedding_size = 16
plr_hidden_1 = 64
plr_hidden_2 = 16
n_epochs = 256
use_early_stopping = true
train_metric_name = "hlgauss"
loss_n_bins = 384
loss_sigma = 0.14702646635624544
