normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.28758633412001877
plr_sigma = 29.159841527734187
sq_mom = 0.9678938595122687
plr_lr_factor = 0.14485201717526655
scale_lr_factor = 2.634319649286004
first_layer_lr_factor = 0.4806168249870863
lr = 0.29030603188800175
wd = 0.001005684215665858
muon_lr = 0.07998274241021318
muon_mom = 0.95
max_one_hot_cat_size = 32
embedding_size = 16
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "hlgauss"
loss_n_bins = 992
loss_sigma = 0.14473176058123158
