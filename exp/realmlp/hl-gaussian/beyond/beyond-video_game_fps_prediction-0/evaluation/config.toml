function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-video_game_fps_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 2
hidden_width = 512
p_drop = 0.3329875595242068
plr_sigma = 25.746976625367314
sq_mom = 0.979495311556298
plr_lr_factor = 0.21548093370989582
scale_lr_factor = 2.2755969996095815
first_layer_lr_factor = 0.894444326770581
lr = 0.12564639484121298
wd = 0.04593014235481707
muon_lr = 0.020314991325793428
muon_mom = 0.95
max_one_hot_cat_size = 6
embedding_size = 16
plr_hidden_1 = 32
plr_hidden_2 = 32
n_epochs = 512
use_early_stopping = true
train_metric_name = "hlgauss"
loss_n_bins = 960
loss_sigma = 1.700737956779466
