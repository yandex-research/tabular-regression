function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-telemonitoring_parkinsons_biomedical_voice_measurements-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.2691901039195049
plr_sigma = 10.499638265065656
sq_mom = 0.9949629382154197
plr_lr_factor = 0.2872029681945087
scale_lr_factor = 4.017099182819004
first_layer_lr_factor = 0.8747347039391407
lr = 0.258873991168655
wd = 0.0027348551983043083
muon_lr = 0.0291730361226672
muon_mom = 0.95
max_one_hot_cat_size = 18
embedding_size = 4
plr_hidden_1 = 64
plr_hidden_2 = 32
n_epochs = 512
use_early_stopping = true
train_metric_name = "hlgauss"
loss_n_bins = 608
loss_sigma = 0.4325202193762391
