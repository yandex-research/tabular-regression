block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 2
hidden_width = 384
p_drop = 0.41447001460868155
plr_sigma = 0.010408027369344307
sq_mom = 0.9761885117011708
plr_lr_factor = 0.08111049396789528
scale_lr_factor = 6.529930583012149
first_layer_lr_factor = 1.411439236775607
lr = 0.03922711723706226
wd = 0.00952519836948674
muon_lr = 0.09938602841676006
muon_mom = 0.95
max_one_hot_cat_size = 13
embedding_size = 8
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "hlgauss"
loss_n_bins = 320
loss_sigma = 1.5718673929407865
