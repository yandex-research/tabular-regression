function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.06886577180787068
plr_sigma = 0.4523196440592707
sq_mom = 0.9646483116398006
plr_lr_factor = 0.06028644317038735
scale_lr_factor = 2.063532977384917
first_layer_lr_factor = 0.4460593783884946
lr = 0.1727479956349587
wd = 0.006819955548859178
muon_lr = 0.058849193910717544
muon_mom = 0.95
max_one_hot_cat_size = 21
embedding_size = 16
plr_hidden_1 = 32
plr_hidden_2 = 8
n_epochs = 256
use_early_stopping = true
train_metric_name = "hlgauss"
loss_n_bins = 576
loss_sigma = 0.3468236331245662
