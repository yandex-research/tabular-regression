block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 4
hidden_width = 256
p_drop = 0.05211341847875045
plr_sigma = 0.8566865298219725
sq_mom = 0.9700388875755314
plr_lr_factor = 0.14102677499462316
scale_lr_factor = 8.14256610549843
first_layer_lr_factor = 0.8145994387123413
lr = 0.0681241759034011
wd = 0.03764811330995898
muon_lr = 0.20218965749290455
muon_mom = 0.95
max_one_hot_cat_size = 4
embedding_size = 4
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "hlgauss"
loss_n_bins = 352
loss_sigma = 0.619928160554318
