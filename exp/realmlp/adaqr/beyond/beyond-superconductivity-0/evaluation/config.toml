scale_lr_factor = 6.790323404980777
first_layer_lr_factor = 0.5848553102594141
lr = 0.02030828886630879
wd = 0.0018054821905549542
muon_lr = 0.20158000880732904
muon_mom = 0.95
max_one_hot_cat_size = 17
embedding_size = 8
plr_hidden_1 = 32
plr_hidden_2 = 16
n_epochs = 256
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 704
regularizer = 0.9545006351264912
