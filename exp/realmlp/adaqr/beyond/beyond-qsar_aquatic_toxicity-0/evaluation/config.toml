first_layer_lr_factor = 0.434636363205998
lr = 0.11590226112067256
wd = 0.023156099709735225
muon_lr = 0.0642883800403205
muon_mom = 0.95
max_one_hot_cat_size = 5
embedding_size = 16
plr_hidden_1 = 16
