function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 256
p_drop = 0.0003505283707995648
plr_sigma = 1.9125574361992332
sq_mom = 0.9629299692768969
plr_lr_factor = 0.08617246919157213
scale_lr_factor = 9.038936305876842
first_layer_lr_factor = 1.1000917383590543
lr = 0.20576386620954917
wd = 0.003781128963702855
muon_lr = 0.1430261232832053
muon_mom = 0.95
max_one_hot_cat_size = 19
embedding_size = 4
plr_hidden_1 = 16
plr_hidden_2 = 16
n_epochs = 512
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 768
regularizer = 0.9013508682704172
