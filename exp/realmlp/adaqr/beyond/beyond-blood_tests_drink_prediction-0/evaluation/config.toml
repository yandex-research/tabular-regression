block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.030487792122885556
plr_sigma = 0.15810545584234978
sq_mom = 0.9532374492056508
plr_lr_factor = 0.14018127395284163
scale_lr_factor = 5.780702551991386
first_layer_lr_factor = 0.777211220928809
lr = 0.07691274755636598
wd = 0.0016485400097139926
muon_lr = 0.029740511229053614
muon_mom = 0.95
max_one_hot_cat_size = 24
embedding_size = 16
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
train_metric_name = "adaqr"
loss_n_quantiles = 544
regularizer = 0.7384474226754174
