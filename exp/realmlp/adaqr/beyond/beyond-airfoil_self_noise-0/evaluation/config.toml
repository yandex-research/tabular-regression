tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 4
hidden_width = 384
p_drop = 0.22380075574197172
plr_sigma = 0.8115088954054072
sq_mom = 0.9925988228482521
plr_lr_factor = 0.059417203159444376
scale_lr_factor = 2.687509117965267
first_layer_lr_factor = 0.7287063778223758
lr = 0.022259393869992407
wd = 0.012157271804772265
muon_lr = 0.2573709100299811
muon_mom = 0.95
max_one_hot_cat_size = 9
embedding_size = 8
plr_hidden_1 = 8
plr_hidden_2 = 8
n_epochs = 512
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 352
regularizer = 0.9122291001410623
