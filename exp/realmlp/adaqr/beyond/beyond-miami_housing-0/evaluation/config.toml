function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-miami_housing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = false
n_hidden_layers = 4
hidden_width = 512
p_drop = 0.12602457755274854
plr_sigma = 2.0506962501998127
sq_mom = 0.9710377884491673
plr_lr_factor = 0.1309681634415633
scale_lr_factor = 3.7355013066254967
first_layer_lr_factor = 0.6170387181210532
lr = 0.2064004599387518
wd = 0.010664639873013618
muon_lr = 0.048681062823047405
muon_mom = 0.95
max_one_hot_cat_size = 12
embedding_size = 4
plr_hidden_1 = 16
plr_hidden_2 = 16
n_epochs = 512
use_early_stopping = true
train_metric_name = "adaqr"
loss_n_quantiles = 992
regularizer = 0.35575446581524367
