function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-sat11_hand_algo_runtime-0"
num_policy = "noisy-quantile"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = true
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.03833383852753345
plr_sigma = 0.058333133666538965
sq_mom = 0.9924318089268956
plr_lr_factor = 0.05323294262772386
scale_lr_factor = 8.79714847096728
first_layer_lr_factor = 0.5750729060389846
lr = 0.2189138322530234
wd = 0.023297017798923236
muon_lr = 0.07432813921334759
muon_mom = 0.95
max_one_hot_cat_size = 13
embedding_size = 8
plr_hidden_1 = 8
plr_hidden_2 = 32
n_epochs = 512
use_early_stopping = true
