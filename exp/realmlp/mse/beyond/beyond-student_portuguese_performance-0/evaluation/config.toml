function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-student_portuguese_performance-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = true
n_hidden_layers = 2
hidden_width = 256
p_drop = 0.02917817949029433
plr_sigma = 5.045114644895482
sq_mom = 0.961920589488217
plr_lr_factor = 0.08146425968948057
scale_lr_factor = 3.681115090766042
first_layer_lr_factor = 0.5479526853247975
lr = 0.15194041918684845
wd = 0.002535288414805135
muon_lr = 0.03185260260078174
muon_mom = 0.95
max_one_hot_cat_size = 10
embedding_size = 8
plr_hidden_1 = 32
plr_hidden_2 = 32
n_epochs = 512
use_early_stopping = true
