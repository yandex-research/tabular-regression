function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-garments_worker_productivity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = true
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.0050224529488469005
plr_sigma = 0.24605631315002538
sq_mom = 0.9883095390548934
plr_lr_factor = 0.1071136584462528
scale_lr_factor = 5.021847575405618
first_layer_lr_factor = 0.6339814296844641
lr = 0.041288184833618916
wd = 0.02843870202672659
muon_lr = 0.10208749658064782
muon_mom = 0.95
max_one_hot_cat_size = 7
embedding_size = 8
plr_hidden_1 = 64
plr_hidden_2 = 8
n_epochs = 256
use_early_stopping = true
