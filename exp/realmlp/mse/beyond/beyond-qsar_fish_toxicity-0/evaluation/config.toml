function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-qsar_fish_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = true
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.04421426135187643
plr_sigma = 1.2261166408951345
sq_mom = 0.9537292294620354
plr_lr_factor = 0.08346434708959184
scale_lr_factor = 2.452008420489198
first_layer_lr_factor = 1.0880107801303913
lr = 0.06022075629737186
wd = 0.011618399701929013
muon_lr = 0.035950712331871956
muon_mom = 0.95
max_one_hot_cat_size = 21
embedding_size = 16
plr_hidden_1 = 64
plr_hidden_2 = 64
n_epochs = 256
use_early_stopping = true
