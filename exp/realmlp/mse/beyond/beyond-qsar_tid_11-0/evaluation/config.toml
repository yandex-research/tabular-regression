function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-qsar_tid_11-0"
num_policy = "noisy-quantile"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = true
n_hidden_layers = 4
hidden_width = 256
p_drop = 0.15291989362611186
plr_sigma = 0.36178337545466166
sq_mom = 0.9851232374904202
plr_lr_factor = 0.2773891572440461
scale_lr_factor = 2.138381748084461
first_layer_lr_factor = 1.391981158344846
lr = 0.024475527849302518
wd = 0.001018441318118282
muon_lr = 0.21505993346703275
muon_mom = 0.95
max_one_hot_cat_size = 8
embedding_size = 16
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
