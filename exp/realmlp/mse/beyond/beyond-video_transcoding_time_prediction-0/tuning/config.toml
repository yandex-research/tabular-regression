seed = 0
function = "bin.realmlp.main"
n_trials = 100
timeout = 86400
n_workers = 1

[sampler]
n_startup_trials = 20

[space]
seed = 0

[space.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[space.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = true
n_hidden_layers = [
    "_tune_",
    "int",
    2,
    4,
]
hidden_width = [
    "_tune_",
    "categorical",
    [
        256,
        384,
        512,
    ],
]
p_drop = [
    "_tune_",
    "uniform",
    0.0,
    0.5,
]
plr_sigma = [
    "_tune_",
    "loguniform",
    0.01,
    50.0,
]
sq_mom = [
    "_tune_",
    "$one_minus_loguniform",
    0.005,
    0.05,
]
plr_lr_factor = [
    "_tune_",
    "loguniform",
    0.05,
    0.3,
]
scale_lr_factor = [
    "_tune_",
    "loguniform",
    2.0,
    10.0,
]
first_layer_lr_factor = [
    "_tune_",
    "loguniform",
    0.3,
    1.5,
]
lr = [
    "_tune_",
    "loguniform",
    0.02,
    0.3,
]
wd = [
    "_tune_",
    "loguniform",
    0.001,
    0.05,
]
muon_lr = [
    "_tune_",
    "loguniform",
    0.02,
    0.3,
]
muon_mom = 0.95
max_one_hot_cat_size = [
    "_tune_",
    "$floor_loguniform",
    4.0,
    33.0,
]
embedding_size = [
    "_tune_",
    "categorical",
    [
        4,
        8,
        16,
    ],
]
plr_hidden_1 = [
    "_tune_",
    "$branched",
    "large_config",
    [
        8,
        16,
        32,
        64,
    ],
    16,
]
plr_hidden_2 = [
    "_tune_",
    "$branched",
    "large_config",
    [
        8,
        16,
        32,
        64,
    ],
    4,
]
n_epochs = [
    "_tune_",
    "$branched",
    "large_config",
    [
        256,
        512,
    ],
    256,
]
use_early_stopping = [
    "_tune_",
    "$branched",
    "large_config",
    [
        true,
    ],
    false,
]
