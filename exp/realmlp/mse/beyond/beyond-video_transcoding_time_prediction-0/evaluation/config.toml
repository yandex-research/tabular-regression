function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = true
n_hidden_layers = 3
hidden_width = 512
p_drop = 0.01283324381574288
plr_sigma = 0.02167556062888674
sq_mom = 0.9856942330607664
plr_lr_factor = 0.05290738610523259
scale_lr_factor = 3.083454411165478
first_layer_lr_factor = 0.5851143230931699
lr = 0.06591648055549498
wd = 0.007946817709697967
muon_lr = 0.10649235764067363
muon_mom = 0.95
max_one_hot_cat_size = 15
embedding_size = 8
plr_hidden_1 = 32
plr_hidden_2 = 64
n_epochs = 512
use_early_stopping = true
