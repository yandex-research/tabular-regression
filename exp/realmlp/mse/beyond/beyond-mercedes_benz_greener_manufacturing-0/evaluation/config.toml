function = "bin.realmlp.main"
n_seeds = 15
n_workers = 1

[base_config.data]
path = "data/beyond-mercedes_benz_greener_manufacturing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.model]
act = "mish"
hidden_sizes = "rectangular"
p_drop_sched = "flat_cos"
n_ens = 8
ens_av_before_softmax = false
weight_param = "ntk"
weight_init_mode = "std"
bias_init_mode = "he+5"
bias_lr_factor = 0.1
use_parametric_act = true
act_lr_factor = 0.1
wd_sched = "flat_cos"
bias_wd_factor = 0.0
block_str = "w-b-a-d"
add_front_scale = true
tfms = [
    "one_hot",
    "median_center",
    "robust_scale",
    "smooth_clip",
    "embedding",
]
num_emb_type = "pbld"
clamp_output = true
lr_sched = "coslog4"
opt = "muon"
early_stopping_multiplicative_patience = 3
early_stopping_additive_patience = 40
normalize_output = true
n_hidden_layers = 4
hidden_width = 256
p_drop = 0.4499387028232605
plr_sigma = 43.84587408769244
sq_mom = 0.9881454288565339
plr_lr_factor = 0.10807741352341185
scale_lr_factor = 6.543302594210181
first_layer_lr_factor = 0.8713942757230452
lr = 0.08564578584904617
wd = 0.031479990292186656
muon_lr = 0.21182606563864723
muon_mom = 0.95
max_one_hot_cat_size = 24
embedding_size = 16
plr_hidden_1 = 16
plr_hidden_2 = 4
n_epochs = 256
use_early_stopping = false
