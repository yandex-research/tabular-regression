function = "bin.adaqr_scale_reg.main"
n_seeds = 15
n_workers = 1

[base_config]
scale_reg_weight = 0.13213665576389186
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 96
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.572420762993654
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-garments_worker_productivity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0010384830533214646
weight_decay = 0.07647976669526292
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.04448467185144858

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 24
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 864
dropout = 0.3497676431458541

[base_config.bins]
n_bins = 44
