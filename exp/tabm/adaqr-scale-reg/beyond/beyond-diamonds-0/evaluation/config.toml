function = "bin.adaqr_scale_reg.main"
n_seeds = 15
n_workers = 1

[base_config]
scale_reg_weight = 0.21914485368900818
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 672
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.5206473527011625
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-diamonds-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0007699207719192253
weight_decay = 0.006092100314438275
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0015929178917368577

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 24
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 176
dropout = 0.0025122343057421654

[base_config.bins]
n_bins = 76
