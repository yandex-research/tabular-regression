function = "bin.adaqr_scale_reg.main"
n_seeds = 15
n_workers = 1

[base_config]
scale_reg_weight = 0.5267978196438111
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 64
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.831905253191396
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.001431478259165373
weight_decay = 0.007582404329925672
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.015774077369409317

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 8
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 256
dropout = 0.19429980264661542

[base_config.bins]
n_bins = 54
