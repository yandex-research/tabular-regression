function = "bin.adaqr_scale_reg.main"
n_seeds = 15
n_workers = 2

[base_config]
scale_reg_weight = 0.14347521472834374
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 1024
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.6147093289457686
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-rossmann_store_sales-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0006816096232701466
weight_decay = 0.045574095498279545
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.024796116087642595

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 16
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 944
dropout = 0.07111062606683885

[base_config.bins]
n_bins = 29
