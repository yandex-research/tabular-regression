function = "bin.adaqr.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 320
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.0340190180418492
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-telemonitoring_parkinsons_biomedical_voice_measurements-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 0.0029723753311159807
weight_decay = 0.010016216383628818
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0020727642231432013

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 32
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 448
dropout = 0.45544029233855016

[base_config.bins]
n_bins = 22
