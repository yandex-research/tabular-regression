function = "bin.adaqr.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 768
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.46851066681646225
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-miami_housing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 5.494759273812987e-05
weight_decay = 0.003110158717279786
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0015617611194509212

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 20
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 208
dropout = 0.0

[base_config.bins]
n_bins = 125
