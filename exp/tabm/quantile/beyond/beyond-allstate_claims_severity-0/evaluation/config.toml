function = "bin.quantile_regression.main"
n_seeds = 15

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 352
agg_mode = "sum"

[base_config.data]
path = "data/beyond-allstate_claims_severity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00014045875823756306
weight_decay = 0.0933338421297029
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0036682696059668735

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 464
dropout = 0.17305511610567068

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 24
activation = false
version = "B"

[base_config.bins]
n_bins = 61
