function = "bin.quantile_regression.main"
n_seeds = 15

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 544
agg_mode = "sum"

[base_config.data]
path = "data/beyond-rossmann_store_sales-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0010055913336355974
weight_decay = 0.011529767684086653
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.032297857782598687

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 832
dropout = 0.0

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 20
activation = false
version = "B"

[base_config.bins]
n_bins = 11
