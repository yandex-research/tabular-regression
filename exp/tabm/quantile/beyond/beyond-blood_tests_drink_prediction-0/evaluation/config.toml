function = "bin.quantile_regression.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 384
agg_mode = "sum"

[base_config.data]
path = "data/beyond-blood_tests_drink_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0003285955681692065
weight_decay = 0.006334005358418984
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.08054332570337029

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 640
dropout = 0.04973892304563632

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 24
activation = false
version = "B"

[base_config.bins]
n_bins = 90
