function = "bin.quantile_regression.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 992
agg_mode = "sum"

[base_config.data]
path = "data/beyond-concrete_compressive_strength-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0017142038788127577
weight_decay = 0.04373745392932645
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00257233205743725

[base_config.model]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 848
dropout = 0.03577888731075456

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 12
activation = false
version = "B"

[base_config.bins]
n_bins = 99
