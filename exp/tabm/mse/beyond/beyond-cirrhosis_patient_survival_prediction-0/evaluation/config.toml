function = "bin.mse.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-cirrhosis_patient_survival_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0019176573715901743
weight_decay = 0.001004093880542171
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0015445364385044587

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.arch.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 16
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 224
dropout = 0.1563380409866229

[base_config.loss_fn]
alpha = 0.0
lambda_pred = 1

[base_config.bins]
n_bins = 51
