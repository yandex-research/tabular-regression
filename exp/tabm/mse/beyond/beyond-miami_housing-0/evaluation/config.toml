function = "bin.mse.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-miami_housing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 0.00012875284261219529
weight_decay = 0.0037005533968498578
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0014033617808234485

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.arch.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 12
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 416
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_pred = 1

[base_config.bins]
n_bins = 124
