seed = 0
function = "bin.mse.main"
n_trials = 100
timeout = 86400

[sampler]
n_startup_trials = 20

[space]
seed = 0
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[space.data]
path = "data/beyond-telemonitoring_parkinsons_biomedical_voice_measurements-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[space.optimizer]
lr = [
    "_tune_",
    "loguniform",
    5e-05,
    0.003,
]
weight_decay = [
    "_tune_",
    "loguniform",
    0.001,
    1.0,
]
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[space.optimizer.muon]
lr = [
    "_tune_",
    "loguniform",
    0.001,
    0.1,
]

[space.model]
mode = "baseline"
m = 1

[space.model.arch]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[space.model.arch.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = [
    "_tune_",
    "int",
    8,
    32,
    4,
]
activation = false
version = "B"

[space.model.backbone]
type = "MLP"
n_blocks = [
    "_tune_",
    "int",
    1,
    4,
]
d_block = [
    "_tune_",
    "int",
    64,
    1024,
    16,
]
dropout = [
    "_tune_",
    "?uniform",
    0.0,
    0.0,
    0.5,
]

[space.loss_fn]
alpha = 0.0
lambda_pred = 1

[space.bins]
n_bins = [
    "_tune_",
    "int",
    2,
    128,
]
