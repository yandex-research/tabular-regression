function = "bin.mse.main"
n_seeds = 15

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-mercari_price_suggestion_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00036000357113955694
weight_decay = 0.0010193969412365224
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.03601591548129701

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "tabm-mini"
share_training_batches = true
k = 32

[base_config.model.arch.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 12
activation = false
version = "B"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 1024
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_pred = 1

[base_config.bins]
n_bins = 128
