function = "bin.hl_gaussian.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 768
sigma = 1.6690253000788686
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-sat11_hand_algo_runtime-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0002459362558358483
weight_decay = 0.16962217905430382
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0019367100520519941

[base_config.model]
arch_type = "tabm-mini"
k = 32
share_training_batches = true

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 528
dropout = 0.0

[base_config.model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 32
activation = false
version = "B"

[base_config.bins]
n_bins = 85
