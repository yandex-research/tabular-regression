function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-fiat_500-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 208
dropout = 0.46290681181771864

[base_config.decoder]
n_blocks = 6
d_block = 304
dropout = 0.029169052916922622
n_heads = 8
temperature = 0.011900578512886425
top_k = 8

[base_config.decoder.vocab]
unnormalized = false
base = 10
length = 15

[base_config.optimizer]
lr = 0.00010833301704316473
weight_decay = 0.22899735361215412
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0006354397971819917
