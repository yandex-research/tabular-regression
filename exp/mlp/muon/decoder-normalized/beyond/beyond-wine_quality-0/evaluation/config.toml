function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-wine_quality-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 736
dropout = 0.0016139692533213533

[base_config.decoder]
n_blocks = 5
d_block = 224
dropout = 0.16561121455482286
n_heads = 2
temperature = 0.2455917769181298
top_k = 1

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 14

[base_config.optimizer]
lr = 0.0001820709853788242
weight_decay = 0.061891034766065195
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0002064438798462704
