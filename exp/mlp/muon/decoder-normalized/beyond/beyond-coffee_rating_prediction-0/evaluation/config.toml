function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-coffee_rating_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 576
dropout = 0.06949529737390911

[base_config.decoder]
n_blocks = 6
d_block = 240
dropout = 0.0
n_heads = 8
temperature = 0.021219548066279695
top_k = 4

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 8

[base_config.optimizer]
lr = 0.00024939044520414747
weight_decay = 0.9283348479369815
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0014001855614372272
