function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-healthcare_insurance_expenses-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 1024
dropout = 0.0

[base_config.decoder]
n_blocks = 5
d_block = 432
dropout = 0.0
n_heads = 8
temperature = 0.0676493678210719
top_k = 1

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 15

[base_config.optimizer]
lr = 0.0004910760206012453
weight_decay = 0.15153745212340963
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.000707047507722717
