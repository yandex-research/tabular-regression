function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-body_density_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 1
d_block = 640
dropout = 0.4430843983828437

[base_config.decoder]
n_blocks = 3
d_block = 512
dropout = 0.0
n_heads = 1
temperature = 0.020938908531780667
top_k = 7

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 11

[base_config.optimizer]
lr = 3.648617365091515e-05
weight_decay = 1.3179256371142776
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0006060137657931265
