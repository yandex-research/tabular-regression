function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-sberbank_housing_market_forecasting-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 1
d_block = 64
dropout = 0.48712810640902515

[base_config.decoder]
n_blocks = 6
d_block = 240
dropout = 0.24515267327436857
n_heads = 1
temperature = 0.02571360652764639
top_k = 6

[base_config.decoder.vocab]
unnormalized = false
base = 4
length = 11

[base_config.optimizer]
lr = 8.208539893633119e-05
weight_decay = 0.6587097976029311
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0010657387789247083
