function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 944
dropout = 0.0

[base_config.decoder]
n_blocks = 4
d_block = 288
dropout = 0.0
n_heads = 4
temperature = 0.041024545385332664
top_k = 5

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 9

[base_config.optimizer]
lr = 0.00026158105476273573
weight_decay = 0.011894513893351586
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0002173179159627556
