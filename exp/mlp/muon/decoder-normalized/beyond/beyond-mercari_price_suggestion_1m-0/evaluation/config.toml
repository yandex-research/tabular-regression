function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-mercari_price_suggestion_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 912
dropout = 0.2337922702561003

[base_config.decoder]
n_blocks = 2
d_block = 64
dropout = 0.0
n_heads = 8
temperature = 0.05056047381425329
top_k = 5

[base_config.decoder.vocab]
unnormalized = false
base = 8
length = 10

[base_config.optimizer]
lr = 0.00010949021541329862
weight_decay = 0.3556716497068329
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0005132359895139816
