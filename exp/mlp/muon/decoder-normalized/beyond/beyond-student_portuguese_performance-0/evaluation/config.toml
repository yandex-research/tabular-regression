function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-student_portuguese_performance-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 1
d_block = 752
dropout = 0.0

[base_config.decoder]
n_blocks = 6
d_block = 272
dropout = 0.19120908735477504
n_heads = 1
temperature = 0.0606490805267972
top_k = 9

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 6

[base_config.optimizer]
lr = 3.0166487296724025e-05
weight_decay = 0.03942839752695916
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0019164674521680533
