function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 64
dropout = 0.0

[base_config.decoder]
n_blocks = 3
d_block = 224
dropout = 0.47207804470351994
n_heads = 2
temperature = 0.01389325323585229
top_k = 2

[base_config.decoder.vocab]
unnormalized = false
base = 8
length = 13

[base_config.optimizer]
lr = 0.0006378787018876474
weight_decay = 0.07030301460033417
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.01954235097320255
