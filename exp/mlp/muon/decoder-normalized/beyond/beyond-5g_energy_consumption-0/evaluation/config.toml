function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-5g_energy_consumption-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 2
d_block = 656
dropout = 0.12972544733546665

[base_config.decoder]
n_blocks = 2
d_block = 496
dropout = 0.0
n_heads = 1
temperature = 0.05646394977966887
top_k = 3

[base_config.decoder.vocab]
unnormalized = false
base = 4
length = 15

[base_config.optimizer]
lr = 0.0003983942552667026
weight_decay = 0.3177207794524023
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0019604001976019025
