function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-diamonds-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 880
dropout = 0.0

[base_config.decoder]
n_blocks = 6
d_block = 496
dropout = 0.0
n_heads = 8
temperature = 0.11171655337872173
top_k = 2

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 9

[base_config.optimizer]
lr = 0.00064737612318122
weight_decay = 0.20263602081286783
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0015078853368792474
