function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-superconductivity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 976
dropout = 0.0

[base_config.decoder]
n_blocks = 6
d_block = 480
dropout = 0.0
n_heads = 2
temperature = 0.3078709664460513
top_k = 1

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 14

[base_config.optimizer]
lr = 0.0006143743598165182
weight_decay = 0.08023651847985207
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.000830196200773403
