function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-sf_permit_time-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 368
dropout = 0.4641672672668463

[base_config.decoder]
n_blocks = 4
d_block = 112
dropout = 0.0
n_heads = 2
temperature = 0.04425172826475626
top_k = 9

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 9

[base_config.optimizer]
lr = 8.50432509015455e-05
weight_decay = 0.1854383169070387
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00029155382882240004
