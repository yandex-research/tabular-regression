function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-rossmann_store_sales-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 480
dropout = 0.16376282054331376

[base_config.decoder]
n_blocks = 3
d_block = 464
dropout = 0.2914131587908221
n_heads = 2
temperature = 0.012630984969430492
top_k = 5

[base_config.decoder.vocab]
unnormalized = false
base = 10
length = 14

[base_config.optimizer]
lr = 4.6072977517562096e-05
weight_decay = 0.3796193210466035
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.002152428767130426
