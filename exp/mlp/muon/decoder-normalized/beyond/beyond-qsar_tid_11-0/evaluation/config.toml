function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_tid_11-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 896
dropout = 0.0

[base_config.decoder]
n_blocks = 5
d_block = 128
dropout = 0.49760754410180486
n_heads = 4
temperature = 0.04901663555802328
top_k = 6

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 8

[base_config.optimizer]
lr = 0.0003881110704051703
weight_decay = 0.09977984462243804
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0004912113545118134
