function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-houses-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 304
dropout = 0.08353389279945969

[base_config.decoder]
n_blocks = 6
d_block = 448
dropout = 0.0
n_heads = 8
temperature = 0.044270025578604835
top_k = 4

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 8

[base_config.optimizer]
lr = 0.0009927323733162443
weight_decay = 0.15748408429699975
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0022690446257535688
