function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-concrete_compressive_strength-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 208
dropout = 0.0

[base_config.decoder]
n_blocks = 3
d_block = 288
dropout = 0.0
n_heads = 1
temperature = 0.08220823996526935
top_k = 7

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 7

[base_config.optimizer]
lr = 5.883386465189286e-05
weight_decay = 0.005295283012377306
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0006238818515049389
