function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-physiochemical_protein-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 640
dropout = 0.0

[base_config.decoder]
n_blocks = 2
d_block = 192
dropout = 0.0
n_heads = 4
temperature = 0.11533074848572242
top_k = 1

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 13

[base_config.optimizer]
lr = 0.00018252111950898956
weight_decay = 0.31206423982275755
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0012710508680774163
