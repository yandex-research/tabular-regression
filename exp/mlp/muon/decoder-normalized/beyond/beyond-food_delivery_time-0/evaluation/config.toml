function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-food_delivery_time-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 848
dropout = 0.0

[base_config.decoder]
n_blocks = 1
d_block = 272
dropout = 0.0
n_heads = 1
temperature = 0.01623587091074236
top_k = 3

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 16

[base_config.optimizer]
lr = 0.0005803555290510225
weight_decay = 0.05773360470465303
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00026782579847055765
