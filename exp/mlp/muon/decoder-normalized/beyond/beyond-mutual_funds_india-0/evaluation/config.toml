function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-mutual_funds_india-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 960
dropout = 0.282625519160534

[base_config.decoder]
n_blocks = 5
d_block = 272
dropout = 0.03447930987874282
n_heads = 4
temperature = 0.011159002031645271
top_k = 9

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 9

[base_config.optimizer]
lr = 0.00014579704468127574
weight_decay = 0.7312595822045505
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0022687579903952837
