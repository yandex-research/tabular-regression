function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-allstate_claims_severity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 3
d_block = 976
dropout = 0.35508606127850506

[base_config.decoder]
n_blocks = 6
d_block = 416
dropout = 0.0
n_heads = 8
temperature = 0.015757203908581728
top_k = 7

[base_config.decoder.vocab]
unnormalized = false
base = 4
length = 15

[base_config.optimizer]
lr = 0.00011924423300166447
weight_decay = 0.7364002186576706
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00029060304091732114
