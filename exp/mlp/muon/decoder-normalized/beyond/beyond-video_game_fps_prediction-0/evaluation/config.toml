function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-video_game_fps_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 1
d_block = 800
dropout = 0.0

[base_config.decoder]
n_blocks = 5
d_block = 128
dropout = 0.0
n_heads = 4
temperature = 0.08441595159024336
top_k = 1

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 10

[base_config.optimizer]
lr = 3.25641075448161e-05
weight_decay = 0.01037880759995678
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0001520582509031814
