function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-garments_worker_productivity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 672
dropout = 0.0

[base_config.decoder]
n_blocks = 3
d_block = 496
dropout = 0.044341434975020994
n_heads = 1
temperature = 0.028892243890805518
top_k = 2

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 4

[base_config.optimizer]
lr = 4.174879172260846e-05
weight_decay = 0.33073415717113075
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0003579464874784147
