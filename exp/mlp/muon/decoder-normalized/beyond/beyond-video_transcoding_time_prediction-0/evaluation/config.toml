function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 2
d_block = 1008
dropout = 0.04618287268256758

[base_config.decoder]
n_blocks = 5
d_block = 448
dropout = 0.2508395558820272
n_heads = 4
temperature = 0.26188879424752126
top_k = 7

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 10

[base_config.optimizer]
lr = 0.000250064243823938
weight_decay = 0.3410072386349949
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0003395737752313114
