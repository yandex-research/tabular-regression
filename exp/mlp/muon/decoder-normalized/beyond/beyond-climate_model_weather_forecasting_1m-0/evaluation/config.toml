function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-climate_model_weather_forecasting_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 352
dropout = 0.31771667207035337

[base_config.decoder]
n_blocks = 4
d_block = 256
dropout = 0.0
n_heads = 4
temperature = 0.022490364354644524
top_k = 8

[base_config.decoder.vocab]
unnormalized = false
base = 8
length = 8

[base_config.optimizer]
lr = 0.00012736170207998913
weight_decay = 0.009023724089666157
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0004901295898122683
