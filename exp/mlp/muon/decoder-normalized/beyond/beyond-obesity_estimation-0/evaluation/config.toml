function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-obesity_estimation-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 144
dropout = 0.0

[base_config.decoder]
n_blocks = 6
d_block = 336
dropout = 0.0
n_heads = 4
temperature = 0.034693161969031466
top_k = 4

[base_config.decoder.vocab]
unnormalized = false
base = 4
length = 10

[base_config.optimizer]
lr = 4.170434089300184e-05
weight_decay = 0.26718341163302023
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.020043767799789586
