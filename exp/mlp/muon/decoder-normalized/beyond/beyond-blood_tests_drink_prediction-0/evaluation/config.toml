function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-blood_tests_drink_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 2
d_block = 208
dropout = 0.0

[base_config.decoder]
n_blocks = 6
d_block = 384
dropout = 0.0
n_heads = 8
temperature = 0.010003410744425992
top_k = 6

[base_config.decoder.vocab]
unnormalized = false
base = 4
length = 9

[base_config.optimizer]
lr = 4.1997870436878945e-05
weight_decay = 0.2918463157015461
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0030781194393018946
