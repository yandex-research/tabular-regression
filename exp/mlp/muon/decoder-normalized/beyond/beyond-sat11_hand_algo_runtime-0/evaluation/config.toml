function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-sat11_hand_algo_runtime-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 272
dropout = 0.0

[base_config.decoder]
n_blocks = 4
d_block = 208
dropout = 0.0
n_heads = 4
temperature = 0.12046712239089209
top_k = 2

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 15

[base_config.optimizer]
lr = 0.0003105930457310246
weight_decay = 0.1006439558510442
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.001539972112894455
