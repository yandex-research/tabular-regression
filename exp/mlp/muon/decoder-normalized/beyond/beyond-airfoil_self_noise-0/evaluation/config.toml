function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-airfoil_self_noise-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 128
dropout = 0.0

[base_config.decoder]
n_blocks = 4
d_block = 336
dropout = 0.09501353828837643
n_heads = 8
temperature = 0.015229969459868231
top_k = 2

[base_config.decoder.vocab]
unnormalized = false
base = 2
length = 7

[base_config.optimizer]
lr = 6.776571818974148e-05
weight_decay = 0.07851150397938718
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.003386453193449446
