function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-cirrhosis_patient_survival_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 1
d_block = 96
dropout = 0.0

[base_config.decoder]
n_blocks = 5
d_block = 256
dropout = 0.31841548944496945
n_heads = 4
temperature = 0.05264947225447237
top_k = 4

[base_config.decoder.vocab]
unnormalized = false
base = 10
length = 10

[base_config.optimizer]
lr = 8.804119360098817e-05
weight_decay = 0.186821803775364
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.019153676568720992
