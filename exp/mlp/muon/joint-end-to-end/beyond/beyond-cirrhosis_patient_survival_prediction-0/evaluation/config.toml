function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-cirrhosis_patient_survival_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00010104377422173655
weight_decay = 0.9530652020953263
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0009005906651491021

[base_config.model]
mode = "joint_end_to_end"
n_bins = 32
soft_sigma = 0.07983828485154075
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 992
dropout = 0.02376812051467237

[base_config.loss_fn]
alpha = 5.640681671291469e-05
lambda_auto = 0.004992326103855741
lambda_kl = 0.037291230224582694
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
