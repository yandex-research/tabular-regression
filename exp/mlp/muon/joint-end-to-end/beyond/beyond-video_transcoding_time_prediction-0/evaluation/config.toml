function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00025075795052195845
weight_decay = 0.8474428211115455
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.002113872763063769

[base_config.model]
mode = "joint_end_to_end"
n_bins = 64
soft_sigma = 0.09090967192081706
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 816
dropout = 0.0

[base_config.loss_fn]
alpha = 0.05211633794022661
lambda_auto = 0.0008758513880731163
lambda_kl = 0.0005924890374476241
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
