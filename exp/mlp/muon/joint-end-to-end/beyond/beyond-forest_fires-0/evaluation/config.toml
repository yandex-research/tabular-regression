function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-forest_fires-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0009926372633571087
weight_decay = 0.09676661984119703
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.004235075848775879

[base_config.model]
mode = "joint_end_to_end"
n_bins = 32
soft_sigma = 0.8061313942237891
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 528
dropout = 0.04725379389552938

[base_config.loss_fn]
alpha = 0.00027652501071107733
lambda_auto = 0.00024362837433612408
lambda_kl = 0.09550527758015592
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
