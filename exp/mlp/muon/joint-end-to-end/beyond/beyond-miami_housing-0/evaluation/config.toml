function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-miami_housing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 5.660868926384886e-05
weight_decay = 0.02749920431180524
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.004900969190939926

[base_config.model]
mode = "joint_end_to_end"
n_bins = 64
soft_sigma = 0.05402233148276571
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 912
dropout = 0.19218108538899314

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.13049598636073026
lambda_kl = 0.00017203714505594625
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
