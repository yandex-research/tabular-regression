function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-concrete_compressive_strength-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 6.813215442032103e-05
weight_decay = 0.9599921447205395
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0015623224192464807

[base_config.model]
mode = "joint_end_to_end"
n_bins = 96
soft_sigma = 0.34537096584428806
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 976
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.18230948985069811
lambda_kl = 0.0001254006838320286
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
