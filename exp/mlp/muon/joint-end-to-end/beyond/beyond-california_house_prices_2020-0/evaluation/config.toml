function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0009228741222665037
weight_decay = 0.4108980998310942
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.003939639853880998

[base_config.model]
mode = "joint_end_to_end"
n_bins = 256
soft_sigma = 3.380062299754315
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 864
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.012649117625434615
lambda_kl = 0.07910271967686511
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
