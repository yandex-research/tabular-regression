function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-5g_energy_consumption-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 3.431378138898103e-05
weight_decay = 0.0625259920492732
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.01132863598063337

[base_config.model]
mode = "joint_end_to_end"
n_bins = 736
soft_sigma = 0.17777928882040808
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 816
dropout = 0.1340816308885734

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.021376956946361648
lambda_kl = 0.019908821194530028
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
