function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-diamonds-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 3.396664705149569e-05
weight_decay = 0.010210310633591128
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00038428899656912105

[base_config.model]
mode = "joint_end_to_end"
n_bins = 224
soft_sigma = 0.04990978960537593
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 576
dropout = 0.3254114322484856

[base_config.loss_fn]
alpha = 0.001444738014978853
lambda_auto = 0.0018489283063985438
lambda_kl = 0.4509033500185306
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
