function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 64
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-wine_quality-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 0.0004991194989442055
weight_decay = 0.962338097827263
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0009115449835989712

[base_config.model]
mode = "joint_end_to_end"
n_bins = 832
soft_sigma = 1.3049687002241184
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 960
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.046078196593353445
lambda_kl = 0.0020155494307042467
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
