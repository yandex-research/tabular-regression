function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-wine_world_cost-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0004689136777489984
weight_decay = 0.024566407742686678
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.024745415590596908

[base_config.model]
mode = "joint_end_to_end"
n_bins = 192
soft_sigma = 3.5378682928966763
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 848
dropout = 0.05860347677105252

[base_config.loss_fn]
alpha = 0.0007197654860034578
lambda_auto = 0.00014165543274309976
lambda_kl = 0.026353792787756077
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
