function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-rossmann_store_sales-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 4.820910973059265e-05
weight_decay = 0.7101463833270598
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0025594593306387764

[base_config.model]
mode = "joint_end_to_end"
n_bins = 224
soft_sigma = 0.2904880529848934
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 432
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.13566143457239901
lambda_kl = 0.09210598122696918
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
