function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-food_delivery_time-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00017547222526521434
weight_decay = 0.04932792855581311
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0003280559957569722

[base_config.model]
mode = "joint_end_to_end"
n_bins = 192
soft_sigma = 0.1081784584489091
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 64
dropout = 0.2712863782255349

[base_config.loss_fn]
alpha = 0.0015311810339358107
lambda_auto = 0.0007805891266831318
lambda_kl = 0.2931425467847615
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
