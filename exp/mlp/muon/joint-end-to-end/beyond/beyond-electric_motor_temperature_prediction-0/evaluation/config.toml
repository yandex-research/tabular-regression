function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-electric_motor_temperature_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 4.357804575587624e-05
weight_decay = 0.6192675761827179
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00047473341982822717

[base_config.model]
mode = "joint_end_to_end"
n_bins = 224
soft_sigma = 1.7219066435392065
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 112
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.0003754895102662427
lambda_kl = 0.04952582335627777
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
