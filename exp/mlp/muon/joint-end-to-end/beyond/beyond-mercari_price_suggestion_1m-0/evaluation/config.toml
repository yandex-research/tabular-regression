function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-mercari_price_suggestion_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 6.096768072661123e-05
weight_decay = 0.01580893235106837
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00020077492688939862

[base_config.model]
mode = "joint_end_to_end"
n_bins = 544
soft_sigma = 0.020250309052999002
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 784
dropout = 0.4034603605457759

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.00045351483867074474
lambda_kl = 0.014837536109741811
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
