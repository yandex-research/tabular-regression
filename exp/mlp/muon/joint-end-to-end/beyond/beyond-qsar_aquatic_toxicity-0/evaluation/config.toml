function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_aquatic_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00012109765467170519
weight_decay = 0.00812777525892623
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0013226175161368393

[base_config.model]
mode = "joint_end_to_end"
n_bins = 96
soft_sigma = 0.7679399562886937
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 688
dropout = 0.20372701860231954

[base_config.loss_fn]
alpha = 0.13127599027969605
lambda_auto = 0.4457476133204458
lambda_kl = 0.01251085582872287
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
