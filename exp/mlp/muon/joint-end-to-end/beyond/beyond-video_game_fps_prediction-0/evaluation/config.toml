function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-video_game_fps_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 7.50030926930787e-05
weight_decay = 0.01241370004807257
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.028980092212657696

[base_config.model]
mode = "joint_end_to_end"
n_bins = 384
soft_sigma = 1.0810973212185124
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 672
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0012387363337706887
lambda_auto = 0.009347496415327124
lambda_kl = 0.5446611703213754
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
