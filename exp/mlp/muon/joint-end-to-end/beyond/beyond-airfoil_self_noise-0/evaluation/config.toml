function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-airfoil_self_noise-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 3.129942423407715e-05
weight_decay = 0.008120394062857953
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0044494636474505895

[base_config.model]
mode = "joint_end_to_end"
n_bins = 640
soft_sigma = 0.28212026912258653
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 400
dropout = 0.0

[base_config.loss_fn]
alpha = 0.00026306575801900427
lambda_auto = 0.009350205236009875
lambda_kl = 0.0001965472360158184
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
