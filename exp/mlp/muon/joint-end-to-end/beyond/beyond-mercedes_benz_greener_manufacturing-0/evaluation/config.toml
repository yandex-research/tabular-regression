function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-mercedes_benz_greener_manufacturing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00012056232807962932
weight_decay = 0.29919994871360633
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.01402562833048782

[base_config.model]
mode = "joint_end_to_end"
n_bins = 128
soft_sigma = 0.06882006877721344
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 160
dropout = 0.4214123673775002

[base_config.loss_fn]
alpha = 9.269508730165034e-05
lambda_auto = 0.00011444236605194604
lambda_kl = 0.16832118783029953
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
