function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-sf_permit_time-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 3.78074814076946e-05
weight_decay = 0.5599162182847467
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0017645341730198772

[base_config.model]
mode = "joint_end_to_end"
n_bins = 160
soft_sigma = 0.47304072983588563
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 112
dropout = 0.27465198521761974

[base_config.loss_fn]
alpha = 0.0026410509715642
lambda_auto = 0.0035295613194900864
lambda_kl = 0.16477041193356032
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
