function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-climate_model_weather_forecasting_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 5.1727554317586076e-05
weight_decay = 0.01893789425606071
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00014828321578788385

[base_config.model]
mode = "joint_end_to_end"
n_bins = 928
soft_sigma = 0.048075880085329904
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 240
dropout = 0.47559057994419235

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.008632396312703069
lambda_kl = 0.4646620460995302
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
