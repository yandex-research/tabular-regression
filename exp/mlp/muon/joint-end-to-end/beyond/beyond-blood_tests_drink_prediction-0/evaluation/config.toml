function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-blood_tests_drink_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00045860184301924853
weight_decay = 0.011398724183003892
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00043041506014899816

[base_config.model]
mode = "joint_end_to_end"
n_bins = 160
soft_sigma = 2.2164599392771973
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 672
dropout = 0.3858615774321363

[base_config.loss_fn]
alpha = 0.025390464825078736
lambda_auto = 0.9817829208683948
lambda_kl = 0.048821680757834746
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
