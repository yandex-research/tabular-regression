function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-coffee_rating_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0001695187532581379
weight_decay = 0.42897526368059236
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.007231647173868402

[base_config.model]
mode = "joint_end_to_end"
n_bins = 128
soft_sigma = 4.120423368855515
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 800
dropout = 0.45917164314449155

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.11691595924700386
lambda_kl = 0.018915284750923654
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
