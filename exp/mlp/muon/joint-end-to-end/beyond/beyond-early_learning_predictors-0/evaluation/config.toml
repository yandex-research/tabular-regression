function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 7.667669564997414e-05
weight_decay = 0.787120068066771
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.005409770434397178

[base_config.model]
mode = "joint_end_to_end"
n_bins = 96
soft_sigma = 0.031018625065750923
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 656
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.0421425650014791
lambda_kl = 0.14764201367719784
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
