function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-healthcare_insurance_expenses-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00012013405362731839
weight_decay = 1.079456302675801
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0002747963774381774

[base_config.model]
mode = "joint_end_to_end"
n_bins = 480
soft_sigma = 1.9354876754732542
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 848
dropout = 0.3694169443558713

[base_config.loss_fn]
alpha = 0.007747556287488974
lambda_auto = 0.00030950940890629784
lambda_kl = 0.0002579476615078263
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
