function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_fish_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 3.0593516202954835e-05
weight_decay = 1.1985741831122694
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00970829526197049

[base_config.model]
mode = "joint_end_to_end"
n_bins = 832
soft_sigma = 0.02149705503133807
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 1008
dropout = 0.25576652185256127

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.02732071873907489
lambda_kl = 0.0005177802378043306
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
