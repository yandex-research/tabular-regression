function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-telemonitoring_parkinsons_biomedical_voice_measurements-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 0.0009887069638947954
weight_decay = 0.005741016215743428
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00010824722948671114

[base_config.model]
mode = "joint_end_to_end"
n_bins = 32
soft_sigma = 0.41732556118057706
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 640
dropout = 0.48142519944182716

[base_config.loss_fn]
alpha = 0.0033545722676146658
lambda_auto = 0.00010816183462595858
lambda_kl = 0.15212862723538073
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
