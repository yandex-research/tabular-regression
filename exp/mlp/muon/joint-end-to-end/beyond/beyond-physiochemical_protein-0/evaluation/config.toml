function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-physiochemical_protein-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0008630635524612804
weight_decay = 0.41220233282329555
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0006791343503944642

[base_config.model]
mode = "joint_end_to_end"
n_bins = 640
soft_sigma = 0.05989055682838948
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 864
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
lambda_auto = 0.0001492145147757872
lambda_kl = 0.5145478713840956
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
