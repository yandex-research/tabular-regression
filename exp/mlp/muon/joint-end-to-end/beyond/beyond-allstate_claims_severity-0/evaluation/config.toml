function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-allstate_claims_severity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00016508292482108255
weight_decay = 0.43159555571719566
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00026414599299081596

[base_config.model]
mode = "joint_end_to_end"
n_bins = 416
soft_sigma = 0.14876651080156147
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 816
dropout = 0.10918079637702442

[base_config.loss_fn]
alpha = 2.9342133603367554e-05
lambda_auto = 0.0008002741522984704
lambda_kl = 0.40497860123504964
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
