function = "bin.joint_end_to_end.main"
n_seeds = 15

[base_config]
batch_size = 64
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_tid_11-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00015606391399346163
weight_decay = 0.5181152633757086
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0002938550831399084

[base_config.model]
mode = "joint_end_to_end"
n_bins = 768
soft_sigma = 0.12115717384501774
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 848
dropout = 0.0003097251072206597

[base_config.loss_fn]
alpha = 7.305886555648744e-05
lambda_auto = 0.00021731760372696707
lambda_kl = 0.03872318338286855
loss_mode = "logsoftmax_kl"
sb_min_value_relative = -1
sb_max_value_relative = 1
lambda_pred = 1
