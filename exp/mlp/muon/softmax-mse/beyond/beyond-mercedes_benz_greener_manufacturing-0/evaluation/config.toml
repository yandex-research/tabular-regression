function = "bin.softmax_mse.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 960
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-mercedes_benz_greener_manufacturing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0009979681127642941
weight_decay = 0.017691707854734274
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00020280369449861556

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 64
dropout = 0.24460938066687965
