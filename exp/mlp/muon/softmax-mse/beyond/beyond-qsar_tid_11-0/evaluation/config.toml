    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.001866926611462828

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 576
dropout = 0.05714061213181806
