function = "bin.softmax_mse.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 32
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0002711108593699961
weight_decay = 3.2202807252327097
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0009605608188124774

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 784
dropout = 0.0
