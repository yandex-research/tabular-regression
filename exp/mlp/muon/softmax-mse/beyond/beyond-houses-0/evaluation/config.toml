function = "bin.softmax_mse.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 320
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-houses-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0001986497275189231
weight_decay = 0.2708431954115362
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.005652664945609051

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 496
dropout = 0.028758311833771002
