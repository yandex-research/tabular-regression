function = "bin.softmax_mse.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 256
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-sf_permit_time-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 6.693429110938216e-05
weight_decay = 1.7601144190479885
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.000604237921146265

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 1008
dropout = 0.2823961108919564
