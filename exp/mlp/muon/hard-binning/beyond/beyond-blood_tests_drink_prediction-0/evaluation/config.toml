function = "bin.hard_binning.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-blood_tests_drink_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.000506913501306109
weight_decay = 0.006843972322951839
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.012905215583211475

[base_config.model]
mode = "hard_binning_uniform"
n_bins = 160
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 304
dropout = 0.42532473014686206

[base_config.loss_fn]
sb_min_value_relative = -1
sb_max_value_relative = 1
alpha = 0.0
lambda_pred = 1
