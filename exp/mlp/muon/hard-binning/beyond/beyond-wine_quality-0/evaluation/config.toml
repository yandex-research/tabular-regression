function = "bin.hard_binning.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-wine_quality-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 3.221722939172642e-05
weight_decay = 0.22254250303245585
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0009808057442986294

[base_config.model]
mode = "hard_binning_uniform"
n_bins = 352
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 784
dropout = 0.0

[base_config.loss_fn]
sb_min_value_relative = -1
sb_max_value_relative = 1
alpha = 0.0
lambda_pred = 1
