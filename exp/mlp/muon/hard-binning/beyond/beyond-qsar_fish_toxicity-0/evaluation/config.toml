function = "bin.hard_binning.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_fish_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 5.68374311131799e-05
weight_decay = 0.026217282354949818
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.01580723077953491

[base_config.model]
mode = "hard_binning_uniform"
n_bins = 544
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 352
dropout = 0.0

[base_config.loss_fn]
sb_min_value_relative = -1
sb_max_value_relative = 1
alpha = 0.0
lambda_pred = 1
