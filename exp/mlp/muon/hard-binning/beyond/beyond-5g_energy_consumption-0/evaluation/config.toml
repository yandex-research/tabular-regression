function = "bin.hard_binning.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-5g_energy_consumption-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0005213452427719722
weight_decay = 0.10138222099313932
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0004771005383731975

[base_config.model]
mode = "hard_binning_uniform"
n_bins = 608
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 656
dropout = 0.2511235512745301

[base_config.loss_fn]
sb_min_value_relative = -1
sb_max_value_relative = 1
alpha = 0.0
lambda_pred = 1
