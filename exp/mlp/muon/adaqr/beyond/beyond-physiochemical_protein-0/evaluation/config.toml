function = "bin.adaqr.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 864
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.6482496501142658
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-physiochemical_protein-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00024492368881756985
weight_decay = 0.28509807191916753
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00036587007887257396

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 848
dropout = 0.06835312382436329
