function = "bin.adaqr.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 576
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.9214927408195772
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-superconductivity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 4.487569222714119e-05
weight_decay = 0.12788802947365663
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0007780418759698853

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 976
dropout = 0.0
