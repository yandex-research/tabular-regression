function = "bin.adaqr.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 128
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = 0.1359901227882931
min_sigma = 1e-05

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0005460845465612374
weight_decay = 0.3881212364082968
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0005560291804571925

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 560
dropout = 0.3717623135794526
