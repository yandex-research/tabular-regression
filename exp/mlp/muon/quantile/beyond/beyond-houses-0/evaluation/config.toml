function = "bin.quantile_regression.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 416
agg_mode = "sum"

[base_config.data]
path = "data/beyond-houses-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00014056196015965113
weight_decay = 0.18285181791574517
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0010300238596509278

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 992
dropout = 0.15255369683005715
