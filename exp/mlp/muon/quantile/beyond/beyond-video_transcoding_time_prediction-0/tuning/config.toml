seed = 0
function = "bin.quantile_regression.main"
n_trials = 100

[sampler]
n_startup_trials = 20

[space]
seed = 0
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = [
    "_tune_",
    "int",
    32,
    1024,
    32,
]
agg_mode = "sum"

[space.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[space.optimizer]
lr = [
    "_tune_",
    "loguniform",
    3e-05,
    0.001,
]
weight_decay = [
    "_tune_",
    "loguniform",
    0.005,
    5.0,
]
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[space.optimizer.muon]
lr = [
    "_tune_",
    "loguniform",
    0.0001,
    0.03,
]

[space.model]
arch_type = "plain"

[space.model.backbone]
type = "MLP"
n_blocks = [
    "_tune_",
    "int",
    1,
    6,
]
d_block = [
    "_tune_",
    "int",
    64,
    1024,
    16,
]
dropout = [
    "_tune_",
    "?uniform",
    0.0,
    0.0,
    0.5,
]
