function = "bin.soft_binning.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-wine_world_cost-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 8.994518401858815e-05
weight_decay = 0.019705005345690384
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.024833218151239126

[base_config.model]
mode = "soft_binning_uniform"
n_bins = 736
soft_sigma = 1.3931196556829468
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 624
dropout = 0.4222574677678153

[base_config.loss_fn]
sb_min_value_relative = -1
sb_max_value_relative = 1
alpha = 0.0
lambda_pred = 1
