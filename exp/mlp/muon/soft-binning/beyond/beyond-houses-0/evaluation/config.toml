function = "bin.soft_binning.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-houses-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0003554876012088378
weight_decay = 0.6217910254964726
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0052934699905737214

[base_config.model]
mode = "soft_binning_uniform"
n_bins = 160
soft_sigma = 0.691689269484283
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 544
dropout = 0.0

[base_config.loss_fn]
sb_min_value_relative = -1
sb_max_value_relative = 1
alpha = 0.0
lambda_pred = 1
