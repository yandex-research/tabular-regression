function = "bin.hl_gaussian.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 992
sigma = 1.6371740192143662
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-miami_housing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 0.00023792722660537986
weight_decay = 0.21599773272985512
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.001808542731118445

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 512
dropout = 0.24200234137097518
