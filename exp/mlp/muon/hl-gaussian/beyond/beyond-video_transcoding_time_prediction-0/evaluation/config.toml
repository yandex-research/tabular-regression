function = "bin.hl_gaussian.main"
n_seeds = 15

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 288
sigma = 1.8847346610924194
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0009974642382691186
weight_decay = 0.01397888200637349
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.005486672790622462

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 784
dropout = 0.0
