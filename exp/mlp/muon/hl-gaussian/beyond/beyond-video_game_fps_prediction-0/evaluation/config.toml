function = "bin.hl_gaussian.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 384
sigma = 1.4509687484912084
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-video_game_fps_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0008966393592843214
weight_decay = 0.025783696173279063
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.027349703230180693

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 768
dropout = 0.0
