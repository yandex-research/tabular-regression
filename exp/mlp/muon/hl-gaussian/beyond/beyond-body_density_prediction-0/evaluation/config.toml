function = "bin.hl_gaussian.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 128
sigma = 1.1122378123645713
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-body_density_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0008045103830841927
weight_decay = 0.5139091991271355
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.015828665915865608

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 320
dropout = 0.0
