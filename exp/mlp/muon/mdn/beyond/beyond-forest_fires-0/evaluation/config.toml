function = "bin.mdn.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
mixture_size = 18

[base_config.data]
path = "data/beyond-forest_fires-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0003996550689320404
weight_decay = 0.24619377388277583
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0011451395626244304

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 640
dropout = 0.0
