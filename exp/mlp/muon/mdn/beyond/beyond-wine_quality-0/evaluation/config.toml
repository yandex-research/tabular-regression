function = "bin.mdn.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
mixture_size = 2

[base_config.data]
path = "data/beyond-wine_quality-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 0.0009231730342944207
weight_decay = 0.034843219001169004
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0007997557249499111

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 800
dropout = 0.008800318208360858
