function = "bin.mdn.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
mixture_size = 45

[base_config.data]
path = "data/beyond-electric_motor_temperature_prediction-0"
