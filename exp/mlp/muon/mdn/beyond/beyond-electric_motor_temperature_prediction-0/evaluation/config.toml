cache = true

[base_config.optimizer]
lr = 0.0008717437135961861
weight_decay = 1.448434120266332
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0001692832852186687

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 944
dropout = 0.2271215893545993
