cache = true

[base_config.optimizer]
lr = 7.475640252218094e-05
weight_decay = 0.01674685633568881
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0014104208675261168

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 752
dropout = 0.0
