function = "bin.mdn.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
mixture_size = 46

[base_config.data]
path = "data/beyond-sberbank_housing_market_forecasting-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.000921209396128418
weight_decay = 0.23165436410265403
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00037620200808252446

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 672
dropout = 0.42665463185304264
