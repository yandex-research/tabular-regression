function = "bin.mdn.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
mixture_size = 5

[base_config.data]
path = "data/beyond-sf_permit_time-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 5.4448707930935625e-05
weight_decay = 0.08893526694782163
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.005276123302424582

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 160
dropout = 0.4909138886462814
