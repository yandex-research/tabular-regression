function = "bin.nll.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 64
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-qsar_tid_11-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.000935530070261501
weight_decay = 0.3044514587083266
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0016210010663404656

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 528
dropout = 0.0
