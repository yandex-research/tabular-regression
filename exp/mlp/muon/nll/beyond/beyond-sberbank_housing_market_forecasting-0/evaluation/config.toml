function = "bin.nll.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-sberbank_housing_market_forecasting-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 7.919861982289717e-05
weight_decay = 0.9889152208900608
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0023574488558294354

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 560
dropout = 0.0
