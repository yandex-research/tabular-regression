function = "bin.nll.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-healthcare_insurance_expenses-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00037606149142128893
weight_decay = 0.18749131668329172
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0013623415098536907

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 576
dropout = 0.2895985799199335
