function = "bin.nll.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 128
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-immoscout_german_house_prices-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 6.144796569327778e-05
weight_decay = 0.05534873331719277
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0027780547981436964

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 960
dropout = 0.0
