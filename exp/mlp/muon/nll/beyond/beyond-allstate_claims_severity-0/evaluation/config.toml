function = "bin.nll.main"
n_seeds = 15
n_workers = 2

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-allstate_claims_severity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 3.968543839490513e-05
weight_decay = 0.3459047695646462
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00018924150179977771

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 464
dropout = 0.38615842857579513
