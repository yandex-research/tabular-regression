function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 1.5666746586933746
basic_loss = "l1"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-physiochemical_protein-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 8.767885764949981e-05
weight_decay = 0.2940672698201188
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.003197638600259451

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 912
dropout = 0.0
