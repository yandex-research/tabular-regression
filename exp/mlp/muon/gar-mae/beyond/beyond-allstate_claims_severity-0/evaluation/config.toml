function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 1.5409893585703598
basic_loss = "l1"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-allstate_claims_severity-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 3.052098039795836e-05
weight_decay = 0.6256609446395067
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0001975152507658306

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 496
dropout = 0.04797523729310065
