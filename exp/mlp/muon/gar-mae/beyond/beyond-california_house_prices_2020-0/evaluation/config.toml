function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 9.381247575594482
basic_loss = "l1"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.000997161159786621
weight_decay = 0.5179367314720549
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.007579726624004356

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 576
dropout = 0.0
