function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 1.1962746350874829
basic_loss = "l1"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 4.8648987158715196e-05
weight_decay = 0.712542789872607
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0004380800995892371

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 912
dropout = 0.4949780112406169
