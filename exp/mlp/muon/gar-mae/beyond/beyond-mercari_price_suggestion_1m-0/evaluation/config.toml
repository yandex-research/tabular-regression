function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 0.9092875051975419
basic_loss = "l1"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-mercari_price_suggestion_1m-0"
