function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 5.885800206429176
basic_loss = "l1"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-coffee_rating_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0001424690834787086
weight_decay = 0.48651191910998665
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.006866934713573249

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 512
dropout = 0.014888005941700842
