function = "bin.mae.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-concrete_compressive_strength-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.000238203876023603
weight_decay = 0.2642078706191907
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.004150091141207237

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 480
dropout = 0.0

[base_config.loss_fn]
loss_mode = "l_1"
alpha = 0.0
