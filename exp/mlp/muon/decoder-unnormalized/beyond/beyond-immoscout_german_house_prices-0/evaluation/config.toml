function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 128
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-immoscout_german_house_prices-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 928
dropout = 0.2054321936975118

[base_config.decoder]
n_blocks = 4
d_block = 416
dropout = 0.09289524533992179
n_heads = 4
temperature = 0.1731281736953306
top_k = 7

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0004642662591583167
weight_decay = 0.05092685538875049
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00035297728026038215
