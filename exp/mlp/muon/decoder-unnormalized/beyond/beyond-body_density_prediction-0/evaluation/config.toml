function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-body_density_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 528
dropout = 0.06667795051034442

[base_config.decoder]
n_blocks = 3
d_block = 160
dropout = 0.0
n_heads = 2
temperature = 0.1553003255393542
top_k = 9

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00015116824115898208
weight_decay = 0.24156826602558407
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.006237657229202678
