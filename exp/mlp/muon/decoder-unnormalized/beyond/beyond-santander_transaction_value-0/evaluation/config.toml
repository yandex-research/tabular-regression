function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-santander_transaction_value-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 3
d_block = 384
dropout = 0.4026530088914534

[base_config.decoder]
n_blocks = 4
d_block = 384
dropout = 0.0
n_heads = 2
temperature = 0.01926269752853641
top_k = 8

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0008346527535310419
weight_decay = 0.01865969314033085
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0008406489624052593
