function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_aquatic_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 256
dropout = 0.0

[base_config.decoder]
n_blocks = 4
d_block = 352
dropout = 0.34946782966641343
n_heads = 2
temperature = 0.04643903125826665
top_k = 7

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00023651932480424462
weight_decay = 0.038705457358811195
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0024207873437579594
