function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-mutual_funds_india-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 1
d_block = 960
dropout = 0.35084114893880347

[base_config.decoder]
n_blocks = 3
d_block = 368
dropout = 0.40476548909764654
n_heads = 4
temperature = 0.017071081516273363
top_k = 4

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00011770636383775863
weight_decay = 0.08597998082883872
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00421937780388452
