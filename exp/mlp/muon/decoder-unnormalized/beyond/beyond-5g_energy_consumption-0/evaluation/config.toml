function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-5g_energy_consumption-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 3
d_block = 976
dropout = 0.0

[base_config.decoder]
n_blocks = 5
d_block = 384
dropout = 0.3459782245587003
n_heads = 2
temperature = 0.07741151120548326
top_k = 7

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00034936460022781906
weight_decay = 0.12309785632198195
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0002908100341390067
