function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-physiochemical_protein-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 672
dropout = 0.0

[base_config.decoder]
n_blocks = 4
d_block = 464
dropout = 0.21067748421890872
n_heads = 1
temperature = 0.013940071435480919
top_k = 6

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0004956689790849284
weight_decay = 0.1056980174226161
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0006372992630076859
