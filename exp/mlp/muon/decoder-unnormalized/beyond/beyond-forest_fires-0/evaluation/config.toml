function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-forest_fires-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 80
dropout = 0.14503880360522203

[base_config.decoder]
n_blocks = 4
d_block = 256
dropout = 0.28498245535063244
n_heads = 4
temperature = 0.054071321161636834
top_k = 9

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00010886127441256561
weight_decay = 0.10152307888989412
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.01619579609220203
