function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-early_learning_predictors-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 2
d_block = 848
dropout = 0.22743561916294253

[base_config.decoder]
n_blocks = 4
d_block = 272
dropout = 0.0
n_heads = 1
temperature = 0.04097991007631769
top_k = 1

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0003258627472695905
weight_decay = 1.3098880358272054
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0006183945191854813
