function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_tid_11-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 864
dropout = 0.36533179374377883

[base_config.decoder]
n_blocks = 6
d_block = 400
dropout = 0.0
n_heads = 2
temperature = 0.19845784697634647
top_k = 8

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00012631260526587361
weight_decay = 0.06505279693187671
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0014893746008881484
