function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-miami_housing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 656
dropout = 0.0

[base_config.decoder]
n_blocks = 5
d_block = 448
dropout = 0.4163992720922755
n_heads = 8
temperature = 0.016068116724506316
top_k = 2

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0009324425920167723
weight_decay = 0.5654480866879014
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0002859094300917588
