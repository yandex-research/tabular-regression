function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-obesity_estimation-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 6
d_block = 208
dropout = 0.3103089765973747

[base_config.decoder]
n_blocks = 1
d_block = 208
dropout = 0.3300245462992964
n_heads = 8
temperature = 0.058269808418671354
top_k = 2

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00043867843213093115
weight_decay = 0.3546139889286821
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0037260073081053498
