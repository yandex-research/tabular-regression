function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-sat11_hand_algo_runtime-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 160
dropout = 0.0

[base_config.decoder]
n_blocks = 6
d_block = 480
dropout = 0.0
n_heads = 1
temperature = 0.010649455659447917
top_k = 8

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0009683467775881951
weight_decay = 0.2675066699240872
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0003314953112584057
