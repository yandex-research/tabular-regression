function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-wine_world_cost-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 272
dropout = 0.26108105578178603

[base_config.decoder]
n_blocks = 6
d_block = 368
dropout = 0.007651116926446655
n_heads = 2
temperature = 0.49905905309638887
top_k = 2

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0005302114237816477
weight_decay = 0.22079393774483022
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.001853574502033187
