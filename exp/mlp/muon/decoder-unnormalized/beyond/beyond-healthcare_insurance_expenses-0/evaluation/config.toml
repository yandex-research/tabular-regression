function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-healthcare_insurance_expenses-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 2
d_block = 624
dropout = 0.17369264430112485

[base_config.decoder]
n_blocks = 6
d_block = 352
dropout = 0.22706220675734584
n_heads = 1
temperature = 0.01573067632272266
top_k = 4

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 3.259204330614698e-05
weight_decay = 0.005868664781290508
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.003054462132406649
