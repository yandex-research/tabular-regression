function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_fish_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 3
d_block = 560
dropout = 0.36005372211198405

[base_config.decoder]
n_blocks = 5
d_block = 320
dropout = 0.22679765420004772
n_heads = 2
temperature = 0.03493900097035779
top_k = 9

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00021777557365402947
weight_decay = 0.2180730961597548
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.005612737093290216
