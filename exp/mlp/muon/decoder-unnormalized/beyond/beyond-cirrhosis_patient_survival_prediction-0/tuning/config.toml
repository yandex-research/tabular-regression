seed = 0
function = "bin.decoder.main"
n_trials = 100
n_workers = 1
timeout = 86400

[sampler]
n_startup_trials = 20

[space]
seed = 0
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[space.data]
path = "data/beyond-cirrhosis_patient_survival_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[space.backbone]
n_blocks = [
    "_tune_",
    "int",
    1,
    6,
]
d_block = [
    "_tune_",
    "int",
    64,
    1024,
    16,
]
dropout = [
    "_tune_",
    "?uniform",
    0.0,
    0.0,
    0.5,
]

[space.decoder]
n_blocks = [
    "_tune_",
    "int",
    1,
    6,
]
d_block = [
    "_tune_",
    "int",
    64,
    512,
    16,
]
dropout = [
    "_tune_",
    "?uniform",
    0.0,
    0.0,
    0.5,
]
n_heads = [
    "_tune_",
    "categorical",
    [
        1,
        2,
        4,
        8,
    ],
]
temperature = [
    "_tune_",
    "loguniform",
    0.01,
    0.5,
]
top_k = [
    "_tune_",
    "int",
    1,
    9,
]

[space.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[space.optimizer]
lr = [
    "_tune_",
    "loguniform",
    3e-05,
    0.001,
]
weight_decay = [
    "_tune_",
    "loguniform",
    0.005,
    5.0,
]
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[space.optimizer.muon]
lr = [
    "_tune_",
    "loguniform",
    0.0001,
    0.03,
]
