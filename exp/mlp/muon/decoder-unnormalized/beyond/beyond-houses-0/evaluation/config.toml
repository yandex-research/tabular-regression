function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-houses-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 2
d_block = 144
dropout = 0.0

[base_config.decoder]
n_blocks = 4
d_block = 80
dropout = 0.2636848840303209
n_heads = 1
temperature = 0.3146660203529258
top_k = 1

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 4.396659173389769e-05
weight_decay = 0.02446192455690592
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.018286813662042874
