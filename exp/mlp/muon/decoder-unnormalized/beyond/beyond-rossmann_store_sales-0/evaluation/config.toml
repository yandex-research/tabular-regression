function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-rossmann_store_sales-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 2
d_block = 1024
dropout = 0.0062749510688211

[base_config.decoder]
n_blocks = 3
d_block = 272
dropout = 0.0
n_heads = 4
temperature = 0.022364995860619546
top_k = 1

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0007178066166556009
weight_decay = 1.55016106365857
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0001973076212549652
