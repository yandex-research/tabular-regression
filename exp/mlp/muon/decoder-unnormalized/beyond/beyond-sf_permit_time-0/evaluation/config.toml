function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-sf_permit_time-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 448
dropout = 0.2345892775216115

[base_config.decoder]
n_blocks = 4
d_block = 336
dropout = 0.30405650402233797
n_heads = 8
temperature = 0.04402412116950889
top_k = 2

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00044504365223875145
weight_decay = 1.1366499994078683
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0009497432720989225
