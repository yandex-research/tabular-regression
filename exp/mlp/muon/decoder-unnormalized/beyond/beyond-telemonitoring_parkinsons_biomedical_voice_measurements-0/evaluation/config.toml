function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-telemonitoring_parkinsons_biomedical_voice_measurements-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.backbone]
n_blocks = 4
d_block = 752
dropout = 0.0

[base_config.decoder]
n_blocks = 3
d_block = 352
dropout = 0.48183138025051464
n_heads = 2
temperature = 0.3737325504074313
top_k = 1

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 4.072007913435921e-05
weight_decay = 0.005749435373559726
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.011547828262799353
