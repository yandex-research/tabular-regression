function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-concrete_compressive_strength-0"
num_policy = "noisy-quantile"
cache = true

[base_config.backbone]
n_blocks = 5
d_block = 656
dropout = 0.0

[base_config.decoder]
n_blocks = 5
d_block = 416
dropout = 0.18060959156133816
n_heads = 4
temperature = 0.04037758327529044
top_k = 8

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.0005431736308013078
weight_decay = 0.6923359077267789
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.002256706639054868
