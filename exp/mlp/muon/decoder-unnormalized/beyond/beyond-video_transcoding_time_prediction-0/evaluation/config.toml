function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-video_transcoding_time_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.backbone]
n_blocks = 2
d_block = 640
dropout = 0.0

[base_config.decoder]
n_blocks = 5
d_block = 160
dropout = 0.0
n_heads = 8
temperature = 0.019766550196666986
top_k = 7

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.00022254567272689038
weight_decay = 1.4505149687427061
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00018572642486457743
