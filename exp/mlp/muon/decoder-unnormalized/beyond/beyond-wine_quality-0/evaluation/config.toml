function = "bin.decoder.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
n_epochs = -1
patience = 16
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-wine_quality-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.backbone]
n_blocks = 3
d_block = 464
dropout = 0.3536676814847931

[base_config.decoder]
n_blocks = 1
d_block = 112
dropout = 0.42406010415431256
n_heads = 1
temperature = 0.013062407024135343
top_k = 5

[base_config.decoder.vocab]
unnormalized = true
base = 10
num_exponent_digits = 1
num_mantissa_digits = 5

[base_config.optimizer]
lr = 0.000143114343451139
weight_decay = 0.013793357629201086
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0022162594749592576
