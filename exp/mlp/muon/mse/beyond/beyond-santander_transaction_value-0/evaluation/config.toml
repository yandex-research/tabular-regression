function = "bin.mse.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-santander_transaction_value-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 4.4410925233569756e-05
weight_decay = 0.11114056775732215
