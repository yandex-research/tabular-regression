function = "bin.mse.main"
n_seeds = 15

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-electric_motor_temperature_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 8.8465661991752e-05
weight_decay = 1.0833032396474964
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00013067856459514967

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 752
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
