function = "bin.mse.main"
n_seeds = 15

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-houses-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00019797342919377362
weight_decay = 0.6319661041445375
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.006796970164894312

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 736
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
