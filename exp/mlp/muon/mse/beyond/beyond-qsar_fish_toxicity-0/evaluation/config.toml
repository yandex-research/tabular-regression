function = "bin.mse.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_fish_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00010088581683187871
weight_decay = 1.0403124736628877
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.009628566409609346

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 704
dropout = 0.0

[base_config.loss_fn]
alpha = 0.0
