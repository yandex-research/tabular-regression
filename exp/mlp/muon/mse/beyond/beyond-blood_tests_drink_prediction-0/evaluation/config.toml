function = "bin.mse.main"
n_seeds = 15

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-blood_tests_drink_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.000878843466217815
weight_decay = 0.01172910911907762
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0015746291023536485

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 432
dropout = 0.4056092421193344

[base_config.loss_fn]
alpha = 0.0
