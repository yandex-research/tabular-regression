function = "bin.rot_reg.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
lambda_ot = 0.00702488408701126
opt_transport_samples = 2
gamma = 0.23486574823102804
y_dim = 6
num_iters = 400

[base_config.data]
path = "data/beyond-sberbank_housing_market_forecasting-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 4.9250799666800806e-05
weight_decay = 0.10255348487824285
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0018017784490990663

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 848
dropout = 0.4438941694928183
