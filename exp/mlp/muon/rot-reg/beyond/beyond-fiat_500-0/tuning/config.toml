seed = 0
function = "bin.rot_reg.main"
n_trials = 100
n_workers = 1

[sampler]
n_startup_trials = 20

[space]
seed = 0
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
lambda_ot = [
    "_tune_",
    "loguniform",
    0.001,
    100,
]
opt_transport_samples = [
    "_tune_",
    "int",
    2,
    200,
    10,
]
gamma = [
    "_tune_",
    "loguniform",
    0.1,
    100,
]
y_dim = [
    "_tune_",
    "int",
    2,
    32,
    2,
]
num_iters = 400

[space.data]
path = "data/beyond-fiat_500-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[space.optimizer]
lr = [
    "_tune_",
    "loguniform",
    3e-05,
    0.001,
]
weight_decay = [
    "_tune_",
    "loguniform",
    0.005,
    5.0,
]
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[space.optimizer.muon]
lr = [
    "_tune_",
    "loguniform",
    0.0001,
    0.03,
]

[space.model]
arch_type = "plain"

[space.model.backbone]
type = "MLP"
n_blocks = [
    "_tune_",
    "int",
    1,
    6,
]
d_block = [
    "_tune_",
    "int",
    64,
    1024,
    16,
]
dropout = [
    "_tune_",
    "?uniform",
    0.0,
    0.0,
    0.5,
]
