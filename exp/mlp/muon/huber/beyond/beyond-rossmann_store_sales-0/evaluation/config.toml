function = "bin.huber.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-rossmann_store_sales-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 4.859717452182274e-05
weight_decay = 0.9276090158870148
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0023597392040808286

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 608
dropout = 0.0

[base_config.loss_fn]
loss_mode = "huber"
huber_delta = 34.56886000511119
alpha = 0.0
