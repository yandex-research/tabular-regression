function = "bin.huber.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_aquatic_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00039973674225216846
weight_decay = 0.01487067138526805
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.00029641548767218325

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 704
dropout = 0.33697108231161205

[base_config.loss_fn]
loss_mode = "huber"
huber_delta = 34.70684004045092
alpha = 0.0
