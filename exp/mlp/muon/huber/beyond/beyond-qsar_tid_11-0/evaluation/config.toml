function = "bin.huber.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-qsar_tid_11-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.00018598128936782988
weight_decay = 0.01638342944220517
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0059995750603167915

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 832
dropout = 0.0

[base_config.loss_fn]
loss_mode = "huber"
huber_delta = 6.672708730167412
alpha = 0.0
