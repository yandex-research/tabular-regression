function = "bin.huber.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-sberbank_housing_market_forecasting-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 6.205807970276196e-05
weight_decay = 0.06192711965888938
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.004078795444109392

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 688
dropout = 0.39506976586342235

[base_config.loss_fn]
loss_mode = "huber"
huber_delta = 0.31911669108691065
alpha = 0.0
