function = "bin.huber.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-blood_tests_drink_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 4.360572450656508e-05
weight_decay = 0.014342393925298593
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.008076584214391091

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 112
dropout = 0.0

[base_config.loss_fn]
loss_mode = "huber"
huber_delta = 0.29268016994037555
alpha = 0.0
