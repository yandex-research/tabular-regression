function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 0.24636645205502952
basic_loss = "l2"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-climate_model_weather_forecasting_1m-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 3.667586280838683e-05
weight_decay = 0.34748941390754123
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0002968303137824824

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 640
dropout = 0.3661555135929445
