function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 0.05073144114669537
basic_loss = "l2"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-physiochemical_protein-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0004085817746933871
weight_decay = 0.5292414691799736
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0009283537956893772

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 672
dropout = 0.0
