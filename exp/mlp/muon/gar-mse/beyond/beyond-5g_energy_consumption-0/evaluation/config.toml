function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 0.07071288616102059
basic_loss = "l2"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-5g_energy_consumption-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 5.970263390661846e-05
weight_decay = 0.008494164305445287
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0058371294047480544

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 848
dropout = 0.05271615690674118
