function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 1.160966031978569
basic_loss = "l2"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-body_density_prediction-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
lr = 0.0006269691327357528
weight_decay = 0.17655049108717405
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.009274444223881212

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 80
dropout = 0.16125989623709536
