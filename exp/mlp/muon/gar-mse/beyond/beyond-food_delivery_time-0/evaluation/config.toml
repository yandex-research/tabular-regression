function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 1.5264140783782902
basic_loss = "l2"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-food_delivery_time-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0008829324836775862
weight_decay = 0.29389832833358226
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0002743676759467559

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 64
dropout = 0.31877633659827553
