function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 1.836493097058133
basic_loss = "l2"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-wine_quality-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
lr = 4.0252950517111994e-05
weight_decay = 0.7575950739566214
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.001451218744951246

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 976
dropout = 0.0
