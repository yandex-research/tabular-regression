function = "bin.gar.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
alpha = 0.09052098710359696
basic_loss = "l2"
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-mutual_funds_india-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0002962109163224704
weight_decay = 0.16167580687494407
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.01303047143290603

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 480
dropout = 0.0
