[base_config.optimizer]
lr = 0.000996071672604407
weight_decay = 0.2724516023514583
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0004277597656922814

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 960
dropout = 0.0
