cache = true

[base_config.optimizer]
lr = 0.00045672221475555645
weight_decay = 0.37895921393928866
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.029861990783633125

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 720
dropout = 0.0
