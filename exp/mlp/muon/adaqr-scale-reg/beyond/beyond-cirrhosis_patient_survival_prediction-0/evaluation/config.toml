cache = true

[base_config.optimizer]
lr = 0.0007661272770859211
weight_decay = 0.009009824923269209
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.016315778422708767

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 704
dropout = 0.0
