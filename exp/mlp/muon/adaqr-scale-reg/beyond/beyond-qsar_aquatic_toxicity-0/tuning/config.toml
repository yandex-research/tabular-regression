seed = 0
function = "bin.adaqr_scale_reg.main"
n_trials = 100
n_workers = 1

[sampler]
n_startup_trials = 20

[space]
scale_reg_weight = [
    "_tune_",
    "loguniform",
    0.001,
    2.0,
]
seed = 0
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = [
    "_tune_",
    "int",
    32,
    1024,
    32,
]
agg_mode = "mean"
y_true_mode = "identity"
raw_sigma_scale = 1.0
regularizer = [
    "_tune_",
    "uniform",
    0.001,
    1.0,
]
min_sigma = 1e-05

[space.data]
path = "data/beyond-qsar_aquatic_toxicity-0"
num_policy = "noisy-quantile"
cache = true

[space.optimizer]
lr = [
    "_tune_",
    "loguniform",
    3e-05,
    0.001,
]
weight_decay = [
    "_tune_",
    "loguniform",
    0.005,
    5.0,
]
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[space.optimizer.muon]
lr = [
    "_tune_",
    "loguniform",
    0.0001,
    0.03,
]

[space.model]
arch_type = "plain"

[space.model.backbone]
type = "MLP"
n_blocks = [
    "_tune_",
    "int",
    1,
    6,
]
d_block = [
    "_tune_",
    "int",
    64,
    1024,
    16,
]
dropout = [
    "_tune_",
    "?uniform",
    0.0,
    0.0,
    0.5,
]
