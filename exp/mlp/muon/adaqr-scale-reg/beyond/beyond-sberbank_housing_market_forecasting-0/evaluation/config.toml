cache = true

[base_config.optimizer]
lr = 4.8674359379523944e-05
weight_decay = 0.04109375428903612
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0023307609486715765

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 928
dropout = 0.336416325637961
