function = "bin.ordinal_entropy.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
lambda_d = 0.00038784984755861764
ordinal_entropy_samples = 710

[base_config.data]
path = "data/beyond-mercedes_benz_greener_manufacturing-0"
