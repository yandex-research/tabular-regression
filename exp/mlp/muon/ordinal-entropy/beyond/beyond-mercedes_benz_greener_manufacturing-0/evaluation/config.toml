cache = true

[base_config.optimizer]
lr = 7.48143603366334e-05
weight_decay = 0.01904288220441229
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0012653025970521617

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 400
dropout = 0.4203670083031001
