function = "bin.ordinal_entropy.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
lambda_d = 2.512951464484165e-05
ordinal_entropy_samples = 160

[base_config.data]
path = "data/beyond-obesity_estimation-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0008769458094231824
weight_decay = 0.3385979940358434
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.006938996812710017

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 160
dropout = 0.0
