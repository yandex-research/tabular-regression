function = "bin.ordinal_entropy.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
lambda_d = 0.04427929857640679
ordinal_entropy_samples = 160

[base_config.data]
path = "data/beyond-food_delivery_time-0"
