function = "bin.ordinal_entropy.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
lambda_d = 6.0035173586136036e-05
ordinal_entropy_samples = 10

[base_config.data]
path = "data/beyond-mercari_price_suggestion_1m-0"
