function = "bin.ordinal_entropy.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
lambda_d = 0.000722677055541357
ordinal_entropy_samples = 410

[base_config.data]
path = "data/beyond-video_game_fps_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 8.306933477373216e-05
weight_decay = 0.06587558671375757
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.005711057040628224

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 848
dropout = 0.0
