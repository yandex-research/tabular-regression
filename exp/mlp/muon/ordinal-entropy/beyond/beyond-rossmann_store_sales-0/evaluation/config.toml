function = "bin.ordinal_entropy.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
lambda_d = 1.0079068473603736e-05
ordinal_entropy_samples = 560

[base_config.data]
path = "data/beyond-rossmann_store_sales-0"
