function = "bin.beta_nll.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
beta = 0.7636727503232885
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-cirrhosis_patient_survival_prediction-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00020691480277388599
weight_decay = 0.08561872839164869
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.017407091345006342

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 768
dropout = 0.41696618437229566
