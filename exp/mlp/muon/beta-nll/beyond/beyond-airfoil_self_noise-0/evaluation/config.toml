function = "bin.beta_nll.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
beta = 0.5460708011302537
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-airfoil_self_noise-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.00010763669965822472
weight_decay = 0.11667719090650808
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0025843271762484915

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 192
dropout = 0.0
