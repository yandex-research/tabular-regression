function = "bin.beta_nll.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
beta = 0.03793216211949154
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
