    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.0024444393180317924

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 992
dropout = 0.0
