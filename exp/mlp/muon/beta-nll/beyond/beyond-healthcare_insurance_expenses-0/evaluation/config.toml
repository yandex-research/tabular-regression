function = "bin.beta_nll.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
beta = 0.20940685593051978
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-healthcare_insurance_expenses-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
lr = 0.0008123723578493205
weight_decay = 0.22895898737117973
betas = [
    0.9,
    0.999,
]
eps = 1e-08

[base_config.optimizer.muon]
lr = 0.006322149167881557

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 816
dropout = 0.12975846996848522
