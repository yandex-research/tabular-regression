function = "bin.mse.main_adamw"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-sat11_hand_algo_runtime-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 5.169153516302675e-05
weight_decay = 0.0

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 912
dropout = 0.23257342407492648

[base_config.loss_fn]
alpha = 0.0
