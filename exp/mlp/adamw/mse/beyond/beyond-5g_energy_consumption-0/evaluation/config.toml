function = "bin.mse.main_adamw"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-5g_energy_consumption-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 0.0005748683025263233
weight_decay = 0.0031461478078313784

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 608
dropout = 0.27931926202060126

[base_config.loss_fn]
alpha = 0.0
