function = "bin.mse.main_adamw"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0

[base_config.data]
path = "data/beyond-physiochemical_protein-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 0.0004800097781676069
weight_decay = 0.0002358006477630188

[base_config.model]
mode = "baseline"
m = 1

[base_config.model.arch]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 3
d_block = 864
dropout = 0.2771100572500236

[base_config.loss_fn]
alpha = 0.0
