function = "bin.quantile_regression.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 352
agg_mode = "sum"

[base_config.data]
path = "data/beyond-superconductivity-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 0.00014262685219212565
weight_decay = 0.0002419186956762369

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 5
d_block = 1008
dropout = 0.08320682236030118
