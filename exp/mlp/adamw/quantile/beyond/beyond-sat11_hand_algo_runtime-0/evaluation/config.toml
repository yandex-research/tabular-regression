function = "bin.quantile_regression.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 672
agg_mode = "sum"

[base_config.data]
path = "data/beyond-sat11_hand_algo_runtime-0"
num_policy = "noisy-quantile"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 0.0002517350467540501
weight_decay = 0.05263554839217228

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 656
dropout = 0.0
