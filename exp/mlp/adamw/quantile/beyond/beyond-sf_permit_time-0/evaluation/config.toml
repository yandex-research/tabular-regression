function = "bin.quantile_regression.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 512
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 192
agg_mode = "sum"

[base_config.data]
path = "data/beyond-sf_permit_time-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 0.00015788419991870722
weight_decay = 0.0

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 1
d_block = 544
dropout = 0.4846140215477332
