function = "bin.quantile_regression.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 288
agg_mode = "sum"

[base_config.data]
path = "data/beyond-food_delivery_time-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 3.385909066141821e-05
weight_decay = 0.0

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 1024
dropout = 0.17213184837835496
