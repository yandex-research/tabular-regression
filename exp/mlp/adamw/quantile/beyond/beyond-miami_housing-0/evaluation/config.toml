function = "bin.quantile_regression.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
y_scale_method = "standard"
n_quantiles = 352
agg_mode = "sum"

[base_config.data]
path = "data/beyond-miami_housing-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 8.66840365659527e-05
weight_decay = 0.0016022269312746607

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 896
dropout = 0.055401298237966023
