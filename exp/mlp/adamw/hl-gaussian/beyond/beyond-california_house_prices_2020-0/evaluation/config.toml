function = "bin.hl_gaussian.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 1024
sigma = 1.7723480402269198
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-california_house_prices_2020-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 0.0009889648603271827
weight_decay = 0.0

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 4
d_block = 1024
dropout = 0.17967680530285873
