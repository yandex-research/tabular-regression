function = "bin.hl_gaussian.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 32
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 64
sigma = 0.014080310422662053
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-coffee_rating_prediction-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 5.342752884680419e-05
weight_decay = 0.0007424616967720249

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 6
d_block = 928
dropout = 0.06276910676516154
