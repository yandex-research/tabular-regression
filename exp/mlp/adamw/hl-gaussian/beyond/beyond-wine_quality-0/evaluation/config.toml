function = "bin.hl_gaussian.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 64
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 160
sigma = 0.6315565186381707
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-wine_quality-0"
num_policy = "noisy-quantile"
bin_policy = "convert-to-cat"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 0.0002085944036310421
weight_decay = 0.05418562265948664

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 752
dropout = 0.0
