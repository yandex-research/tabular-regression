function = "bin.hl_gaussian.main"
n_seeds = 15
n_workers = 1

[base_config]
batch_size = 128
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
bin_support_mode = "y_quantile"
hl_min_value_relative = -1
hl_max_value_relative = 2
hl_num_bins = 864
sigma = 0.9083145882196973
y_scale_method = "standard"

[base_config.data]
path = "data/beyond-immoscout_german_house_prices-0"
num_policy = "noisy-quantile"
cat_policy = "ordinal"
cache = true

[base_config.optimizer]
type = "AdamW"
lr = 0.0002537337482659768
weight_decay = 0.0

[base_config.model]
arch_type = "plain"

[base_config.model.backbone]
type = "MLP"
n_blocks = 2
d_block = 896
dropout = 0.4471112775625092
